<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Simple Round Cake | Counting Game</title>
<link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{font-family:'Nunito',sans-serif;background:#2e003e;color:white;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;}

#confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

.navbar{width:100%; display:flex; justify-content:space-between; align-items:center; padding:15px 25px; background:#673ab7; border-bottom: 4px solid #ffeb3b; z-index: 1000;}
.logo{font-family:'Outfit',sans-serif; font-size:22px; font-weight:900; color: #fff;}
.exit-btn { background: #f44336; color: white; text-decoration: none; padding: 8px 20px; border-radius: 30px; font-weight: 900; border: 2px solid white; }

.instr-bar { background: #ffeb3b; color: #2e003e; padding: 12px 25px; border-radius: 50px; font-weight: 900; margin: 20px 0; width: 90%; max-width: 400px; text-align: center; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3);}

/* --- Simple Round Cake --- */
#game-stage {
    flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative;
}

.cake-base {
    position: relative; width: 320px; height: 160px;
    background: #f06292; /* Main Cake Color */
    border-radius: 50%;
    box-shadow: 0 15px 0 #d81b60, 0 30px 40px rgba(0,0,0,0.5); /* Thickness & Shadow */
    cursor: pointer;
    border: 8px solid #fff; /* Frosting Rim */
}

/* Candle Design */
.candle {
    position: absolute; width: 14px; height: 55px;
    background: #fff; border-radius: 4px; 
    transform: translate(-50%, -100%); /* Sits exactly on the tap point */
    border: 2px solid #555; z-index: 500;
}
.flame {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 22px; background: #ffeb3b; border-radius: 50% 50% 20% 20%;
    box-shadow: 0 0 15px #ff9800; animation: flicker 0.1s infinite alternate;
}
@keyframes flicker { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.1); } }

/* --- UI Controls --- */
.tray {
    width: 100%; background: rgba(0,0,0,0.4); padding: 20px; border-top: 4px solid #ffeb3b;
    display: flex; flex-direction: column; align-items: center; z-index: 1000;
}
.step-panel { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; }
.step-panel.active { display: flex; }

.item {
    width: 50px; height: 50px; background: white; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 900; color: #673ab7; cursor: pointer;
    box-shadow: 0 4px 0 #bbb;
}
#counter { font-size: 2.5rem; font-weight: 900; color: #ffeb3b; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
.refresh-btn { background: #7ce04a; color: #000; padding: 15px 40px; border-radius: 50px; font-weight: 900; border: none; cursor: pointer; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<nav class="navbar">
    <div class="logo">🎂 SIMPLE <span>CAKE</span></div>
    <a href="../down_syndrome.html" class="exit-btn">EXIT</a>
</nav>

<div class="instr-bar" id="status">How old are you? Pick a number!</div>

<div id="game-stage">
    <div class="cake-base" id="cake" onclick="addCandle(event)"></div>
</div>

<div class="tray">
    <div id="counter" style="display:none;">0 / 0</div>
    <div id="step1" class="step-panel active"></div>
    <div id="step2" class="step-panel">
        <button class="refresh-btn" style="display:none;" id="btn-reset" onclick="location.reload()">PLAY AGAIN 🔄</button>
    </div>
</div>

<script>
let target = 0, count = 0, celebrating = false;
const statusTxt = document.getElementById('status'), step1 = document.getElementById('step1'), cake = document.getElementById('cake');

// Create Number Buttons 1-15
for (let i = 1; i <= 15; i++) {
    const b = document.createElement('div');
    b.className = 'item'; b.innerText = i;
    b.onclick = () => { target = i; start(); };
    step1.appendChild(b);
}

function start() {
    speak("Put " + target + " candles on the cake!");
    step1.classList.remove('active');
    document.getElementById('step2').classList.add('active');
    document.getElementById('counter').style.display = 'block';
    updateUI();
    statusTxt.innerText = `Tap the cake to add ${target} candles`;
}

function addCandle(e) {
    if (target === 0 || count >= target) return;

    const rect = cake.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const candle = document.createElement('div');
    candle.className = 'candle';
    candle.style.left = x + 'px';
    candle.style.top = y + 'px';
    
    // Colorful candle patterns
    const colors = ['#f44336', '#2196f3', '#4caf50', '#ffeb3b', '#9c27b0', '#ff9800'];
    candle.style.background = `repeating-linear-gradient(45deg, #fff, #fff 5px, ${colors[count % colors.length]} 5px, ${colors[count % colors.length]} 10px)`;
    
    const flame = document.createElement('div');
    flame.className = 'flame';
    candle.appendChild(flame);
    
    cake.appendChild(candle);
    count++;
    updateUI();
    speak(count);

    if (count === target) {
        celebrating = true;
        statusTxt.innerText = "🎉 HAPPY BIRTHDAY! 🎉";
        document.getElementById('btn-reset').style.display = 'block';
        speak("Happy Birthday!");
        initConfetti();
    }
}

function updateUI() {
    document.getElementById('counter').innerText = `${count} / ${target}`;
}

function speak(msg) {
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(msg));
}

// Simple Confetti Animation
const canvas = document.getElementById('confetti-canvas'), ctx = canvas.getContext('2d');
let dots = [];
function initConfetti() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    for(let i=0; i<120; i++) dots.push({x:Math.random()*canvas.width, y:-20, c:`hsl(${Math.random()*360},100%,50%)`, v:Math.random()*4+3, s:Math.random()*6+4});
    render();
}
function render() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    dots.forEach(d => { d.y += d.v; ctx.fillStyle = d.c; ctx.fillRect(d.x, d.y, d.s, d.s); });
    if(celebrating) requestAnimationFrame(render);
}
</script>
</body>
</html>
