<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Magnet Fridge - Play Mode</title>
    <link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        :root {
            --navy: #0D5791;
            --lime: #A1E231;
            --steel-light: #e5e7eb;
            --steel-dark: #4b5563;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- PLAY OVERLAY --- */
        #play-screen {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: 0.5s;
        }

        .play-circle {
            width: 150px;
            height: 150px;
            background: var(--lime);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 4rem;
            color: var(--navy);
            box-shadow: 0 0 40px rgba(161, 226, 49, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .play-circle:hover { transform: scale(1.1); box-shadow: 0 0 60px var(--lime); }
        .play-hint { margin-top: 25px; color: white; font-family: 'Outfit'; font-size: 1.8rem; font-weight: 700; }

        /* --- Game Header --- */
        .header {
            background: var(--navy);
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--lime);
        }
        .header h1 { font-family: 'Outfit'; color: white; font-size: 1.4rem; }

        .main-game {
            display: flex;
            flex: 1;
            padding: 25px;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        /* --- 3D Fridge Design --- */
        .fridge-3d {
            width: 380px;
            height: 80vh;
            background: linear-gradient(145deg, var(--steel-light), #94a3b8);
            border: 10px solid var(--steel-dark);
            border-radius: 20px;
            position: relative;
            box-shadow: 25px 25px 50px rgba(0,0,0,0.5);
        }

        .fridge-handle {
            position: absolute;
            left: 20px; top: 160px;
            width: 14px; height: 140px;
            background: #1e293b;
            border-radius: 10px;
            box-shadow: 3px 0 8px rgba(0,0,0,0.2);
        }

        /* --- Letter Tray --- */
        .tray {
            width: 340px;
            height: 75vh;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            overflow-y: auto;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .magnet {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Outfit';
            cursor: grab;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            border-bottom: 4px solid rgba(0,0,0,0.2);
        }

        .stuck {
            position: absolute;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.1s;
        }

        .tray::-webkit-scrollbar { width: 6px; }
        .tray::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="play-screen">
        <button class="play-circle" onclick="startApp()">
            <i class="fa-solid fa-play"></i>
        </button>
        <div class="play-hint">Let's Play ABC!</div>
    </div>

    <div class="header">
        <h1>Fun Fridge Magnets</h1>
        <a href="../autism.html" style="color:white; text-decoration:none; font-weight:bold;">EXIT</a>
    </div>

    <div class="main-game">
        <div class="tray" id="letter-tray"></div>

        <div class="fridge-3d" id="fridge-target">
            <div class="fridge-handle"></div>
            <div style="position:absolute; bottom:20px; right:20px; font-weight:900; opacity:0.1; font-family:'Outfit';">LUX-FREEZE</div>
            
            <div style="position:absolute; top:30px; right:30px; background:#fff176; padding:10px; transform:rotate(-4deg); box-shadow:2px 2px 5px rgba(0,0,0,0.2); color:#5d4037; font-size:0.7rem;">
                <b>Don't forget:</b><br>🍎 Apple<br>🥛 Milk
            </div>
        </div>
    </div>

    <script>
        const letters = {
            'A': 'Apple', 'B': 'Ball', 'C': 'Cat', 'D': 'Dog', 'E': 'Elephant',
            'F': 'Fish', 'G': 'Grapes', 'H': 'Hat', 'I': 'Igloo', 'J': 'Juice',
            'K': 'Kite', 'L': 'Lion', 'M': 'Monkey', 'N': 'Nose', 'O': 'Orange',
            'P': 'Parrot', 'Q': 'Queen', 'R': 'Rabbit', 'S': 'Sun', 'T': 'Tiger',
            'U': 'Umbrella', 'V': 'Van', 'W': 'Watch', 'X': 'Xylophone', 'Y': 'Yo-yo', 'Z': 'Zebra'
        };

        const colors = ['#ff5252', '#4caf50', '#2196f3', '#ffeb3b', '#9c27b0', '#ff9800', '#00bcd4'];

        function startApp() {
            document.getElementById('play-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('play-screen').style.display = 'none';
            }, 500);
            speak("Welcome! Drag a letter to the fridge.");
        }

        const tray = document.getElementById('letter-tray');
        Object.keys(letters).forEach((l, i) => {
            const mag = document.createElement('div');
            mag.className = 'magnet';
            mag.innerText = l;
            mag.draggable = true;
            mag.style.backgroundColor = colors[i % colors.length];
            mag.style.color = (mag.style.backgroundColor === '#ffeb3b') ? '#333' : 'white';
            
            mag.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text', l);
                e.dataTransfer.setData('color', mag.style.backgroundColor);
                e.dataTransfer.setData('textColor', mag.style.color);
            });
            tray.appendChild(mag);
        });

        const target = document.getElementById('fridge-target');
        target.addEventListener('dragover', (e) => e.preventDefault());

        target.addEventListener('drop', (e) => {
            e.preventDefault();
            const letter = e.dataTransfer.getData('text');
            const bgColor = e.dataTransfer.getData('color');
            const txtColor = e.dataTransfer.getData('textColor');

            const sMag = document.createElement('div');
            sMag.className = 'magnet stuck';
            sMag.innerText = letter;
            sMag.style.backgroundColor = bgColor;
            sMag.style.color = txtColor;

            const rect = target.getBoundingClientRect();
            sMag.style.left = (e.clientX - rect.left - 27) + 'px';
            sMag.style.top = (e.clientY - rect.top - 27) + 'px';
            sMag.style.transform = `rotate(${Math.floor(Math.random()*20-10)}deg)`;

            target.appendChild(sMag);
            speak(`${letter} for ${letters[letter]}`);
        });

        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = 0.85;
            msg.pitch = 1.1;
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
