<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dungeon Dash | HelpingHands Galaxy</title>
<link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:#02040a;color:white;min-height:100vh;overflow:hidden;}

/* --- Starry Background (Original Layout) --- */
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--d) infinite alternate;}
@keyframes twinkle{0%{opacity:.1;transform:scale(.8)}100%{opacity:.8;transform:scale(1.3)}}

/* --- Navbar --- */
.navbar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:#0D5791;position:sticky;top:0;z-index:100;}
.logo{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900; color: white;}
.logo span{color:#7CE04A;}
.back-link {background:#9c27b0; color:white; text-decoration:none; padding:8px 18px; border-radius:20px; font-weight:700; display:flex; align-items:center; gap:6px;}

/* --- Realistic Dungeon Viewport (No Image) --- */
.container{position:relative;z-index:10;padding:10px;max-width:800px;margin:0 auto;}
.game-viewport {
    width: 100%; height: 450px; 
    /* Dark Stone Gradient instead of image */
    background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 100%);
    border: 4px solid #7ce04a; border-radius: 25px;
    position: relative; overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
}

/* Character Animation */
.character {
    position: absolute; bottom: 40px; left: 60px; width: 80px; height: 80px;
    font-size: 5rem; display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
    animation: bounce 2s infinite ease-in-out;
    z-index: 20;
}
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

/* Realistic Portal */
.magic-portal {
    position: absolute; bottom: 30px; right: 40px; width: 150px; height: 200px;
    border: 8px solid #fff; border-radius: 100px 100px 10px 10px;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(8px);
    box-shadow: inset 0 0 30px rgba(255,255,255,0.2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Floating Items */
.dungeon-item {
    position: absolute; width: 80px; height: 80px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem; transition: 0.4s;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
}
.dungeon-item:hover { transform: scale(1.3) rotate(10deg); }

/* UI Elements */
.hud { position: absolute; top: 20px; left: 20px; font-family: 'Outfit'; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 30px; border: 2px solid #7ce04a; font-weight: bold; }
.instruction { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
.instruction span { background: #fff; color: #000; padding: 10px 25px; border-radius: 50px; font-weight: 900; font-family: 'Outfit'; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

/* Play Overlay */
#playOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.play-btn { background: #7ce04a; color: #000; padding: 20px 60px; font-size: 2.2rem; border-radius: 60px; font-family: 'Outfit'; border: none; cursor: pointer; font-weight: 900; box-shadow: 0 10px 30px rgba(124, 224, 74, 0.4); }
</style>
</head>
<body>

<div id="playOverlay">
    <h1 style="font-family:'Outfit'; font-size: 3.5rem; margin-bottom: 20px; color:#7ce04a;">🗡️ DUNGEON DASH</h1>
    <button class="play-btn" onclick="startGame()">DASH! 🚀</button>
</div>

<div id="stars"></div>

<nav class="navbar">
  <div class="logo">Dungeon <span>Dash</span></div>
  <a href="../dyslexia.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
</nav>

<div class="container">
  <div class="game-viewport" id="viewport">
      <div class="hud">💎 GEMS: <span id="score">0</span></div>
      <div class="instruction"><span id="taskText">Wait...</span></div>
      
      <div class="character">👦</div>
      
      <div class="magic-portal" id="portal">
          <div id="portalTarget" style="font-size: 4rem; filter: blur(1px); opacity: 0.6;">?</div>
          <div style="font-size: 0.8rem; font-weight: bold; margin-top: 10px;">SORT HERE</div>
      </div>
  </div>
</div>

<script>
(function(){
// Original Stars Background
var sc=document.getElementById('stars');
for(var i=0;i<100;i++){var s=document.createElement('div');s.className='star';var sz=Math.random()*2;s.style.cssText='width:'+sz+'px;height:'+sz+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;--d:'+(Math.random()*3+1.5)+'s';sc.appendChild(s);}

let score = 0;
let target = {};
const library = [
    { name: 'Red Heart', color: '#ff4b2b', icon: '❤️' },
    { name: 'Blue Square', color: '#00d2ff', icon: '🟦' },
    { name: 'Green Triangle', color: '#91ff00', icon: '🔺' },
    { name: 'Gold Star', color: '#ffcc33', icon: '⭐' }
];

window.startGame = function() {
    document.getElementById('playOverlay').style.display = 'none';
    nextLevel();
};

function nextLevel() {
    // Clear items
    document.querySelectorAll('.dungeon-item').forEach(e => e.remove());

    // New Target
    target = library[Math.floor(Math.random() * library.length)];
    document.getElementById('taskText').innerText = "Find the " + target.name;
    document.getElementById('portal').style.borderColor = target.color;
    document.getElementById('portal').style.boxShadow = "0 0 40px " + target.color;
    document.getElementById('portalTarget').innerText = target.icon;
    
    speak("Dash to the " + target.name);

    // Spawn 4 shapes
    library.forEach((item, index) => {
        let div = document.createElement('div');
        div.className = 'dungeon-item';
        div.innerHTML = item.icon;
        
        // Random "realistic" floating positions
        div.style.left = (180 + (index * 110)) + "px";
        div.style.top = (120 + Math.random() * 120) + "px";
        
        div.onclick = () => {
            if(item.name === target.name) {
                collect(div);
            } else {
                errorEffect(div);
            }
        };
        document.getElementById('viewport').appendChild(div);
    });
}

function collect(el) {
    score += 10;
    document.getElementById('score').innerText = score;
    el.style.zIndex = "100";
    el.style.transition = "all 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045)";
    el.style.left = "80%";
    el.style.top = "60%";
    el.style.transform = "scale(0.2) rotate(360deg)";
    el.style.opacity = "0";
    
    speak("Sorted!");
    setTimeout(nextLevel, 1000);
}

function errorEffect(el) {
    el.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(-12px)' },
        { transform: 'translateX(12px)' },
        { transform: 'translateX(0)' }
    ], { duration: 300 });
    speak("Not that one! Try " + target.name);
}

function speak(t) {
    window.speechSynthesis.cancel();
    const m = new SpeechSynthesisUtterance(t);
    m.rate = 1.1;
    window.speechSynthesis.speak(m);
}

})();
</script>
</body>
</html>
