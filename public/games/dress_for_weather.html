<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Weather Dress-Up | HelpingHands</title>
<link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:#02040a;color:white;min-height:100vh;overflow:hidden;}

/* --- Starry Background --- */
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--d) infinite alternate;}
@keyframes twinkle{0%{opacity:.1;transform:scale(.8)}100%{opacity:.8;transform:scale(1.3)}}

/* --- Selection Overlay --- */
#selectionOverlay {
    position: fixed; inset: 0; background: rgba(2, 4, 10, 0.98);
    z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.selection-container { display: flex; gap: 30px; margin-top: 20px; }
.char-card {
    background: rgba(255,255,255,0.05); border: 3px solid #7ce04a; border-radius: 20px;
    padding: 20px; cursor: pointer; transition: 0.3s; text-align: center; width: 160px;
}
.char-card:hover { transform: translateY(-10px); background: rgba(124, 224, 74, 0.1); }
.char-img { width: 100px; height: 140px; background-size: contain; background-repeat: no-repeat; margin: 0 auto 10px; }

/* --- Navbar --- */
.navbar{display:flex;justify-content:space-between;align-items:center;padding:12px 25px;background:#0D5791;position:relative;z-index:100;}
.logo{font-family:'Outfit',sans-serif;font-weight:900;font-size:1.4rem;}
.nav-btns { display: flex; gap: 10px; }
.btn-ui { background:#9c27b0; color:white; text-decoration:none; padding:8px 15px; border-radius:20px; font-weight:700; border:none; cursor:pointer; font-size:0.9rem;}

/* --- Game Stage --- */
.container{position:relative;z-index:10;padding:10px;max-width:850px;margin:0 auto;}
.game-viewport {
    width: 100%; height: 480px; 
    background: radial-gradient(circle at center, #1a1a2e 0%, #050508 100%);
    border: 4px solid #ffbb33; border-radius: 30px;
    position: relative; overflow: hidden;
}

/* Weather Window */
.window-frame {
    position: absolute; top: 30px; right: 40px; width: 150px; height: 110px;
    background: #87CEEB; border: 6px solid #5d4037; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 4rem;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/* Avatar Figure */
#activeAvatar {
    position: absolute; bottom: 40px; left: 60px; width: 200px; height: 320px;
    background-size: contain; background-repeat: no-repeat;
    filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6));
    transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Wardrobe Grid */
.wardrobe-grid {
    position: absolute; bottom: 30px; right: 30px; width: 380px;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(15px);
    border: 2px solid rgba(255,255,255,0.1); border-radius: 25px;
    padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
}
.clothing-btn {
    font-size: 3rem; background: rgba(0,0,0,0.4); border-radius: 15px;
    border: 2px solid transparent; cursor: pointer; transition: 0.2s; padding: 15px;
    display: flex; align-items: center; justify-content: center;
}
.clothing-btn:hover { border-color: #ffbb33; background: rgba(255,255,255,0.1); transform: scale(1.05); }

/* HUD */
.instr-bubble { 
    position: absolute; top: 20px; left: 20px; background: white; color: black; 
    padding: 12px 25px; border-radius: 50px; font-weight: 900; font-family: 'Outfit';
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<div id="selectionOverlay">
    <h1 style="font-family:'Outfit'; font-size: 2.8rem; text-align: center; color:#ffbb33;">Who are you?</h1>
    <div class="selection-container">
        <div class="char-card" onclick="pickAvatar('boy')">
            <div class="char-img" style="background-image: url('https://cdn-icons-png.flaticon.com/512/4086/4086679.png');"></div>
            <h2 style="font-family:'Outfit'">BOY</h2>
        </div>
        <div class="char-card" onclick="pickAvatar('girl')">
            <div class="char-img" style="background-image: url('https://cdn-icons-png.flaticon.com/512/4086/4086600.png');"></div>
            <h2 style="font-family:'Outfit'">GIRL</h2>
        </div>
    </div>
</div>

<div id="stars"></div>

<nav class="navbar">
  <div class="logo">DRESS <span>SMART</span></div>
  <div class="nav-btns">
      <button class="btn-ui" onclick="location.reload()" style="background:#546e7a;">Change Avatar</button>
      <a href="../dyslexia.html" class="btn-ui">Exit</a>
  </div>
</nav>

<div class="container">
  <div class="game-viewport">
      <div class="instr-bubble" id="hint">Get Ready!</div>
      
      <div class="window-frame" id="weatherBox">?</div>
      
      <div id="activeAvatar"></div>

      <div class="wardrobe-grid" id="closet">
          </div>
  </div>
</div>

<script>
(function(){
var sc=document.getElementById('stars');
for(var i=0;i<100;i++){var s=document.createElement('div');s.className='star';var sz=Math.random()*2;s.style.cssText='width:'+sz+'px;height:'+sz+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;--d:'+(Math.random()*3+1.5)+'s';sc.appendChild(s);}

let currentTarget = '';
let lastWeatherIndex = -1;

const avatars = {
    'boy': 'https://cdn-icons-png.flaticon.com/512/4086/4086679.png',
    'girl': 'https://cdn-icons-png.flaticon.com/512/4086/4086600.png'
};

const weatherData = [
    { type: 'Sunny', icon: '☀️', color: '#87CEEB', need: '🕶️', text: 'It is Sunny! Wear Sunglasses.' },
    { type: 'Rainy', icon: '🌧️', color: '#4682B4', need: '☂️', text: 'It is Rainy! Use an Umbrella.' },
    { type: 'Snowy', icon: '❄️', color: '#E0FFFF', need: '🧣', text: 'It is Snowy! Wrap a Scarf.' },
    { type: 'Hot', icon: '🔥', color: '#FFA726', need: '👒', text: 'It is very Hot! Put on a Hat.' },
    { type: 'Cold', icon: '🌬️', color: '#B0BEC5', need: '🧥', text: 'It is Cold! Wear a Jacket.' }
];

const allClothes = ['🕶️', '☂️', '🧣', '👒', '🧥', '🧤', '👟', '🎩', '🚲'];

window.pickAvatar = function(type) {
    document.getElementById('activeAvatar').style.backgroundImage = `url(${avatars[type]})`;
    document.getElementById('selectionOverlay').style.display = 'none';
    startNewLevel();
}

function startNewLevel() {
    // Logic to prevent repeating the same weather
    let randomIndex;
    do {
        randomIndex = Math.floor(Math.random() * weatherData.length);
    } while (randomIndex === lastWeatherIndex);
    
    lastWeatherIndex = randomIndex;
    const level = weatherData[randomIndex];
    currentTarget = level.need;
    
    const win = document.getElementById('weatherBox');
    win.innerText = level.icon;
    win.style.background = level.color;
    
    document.getElementById('hint').innerText = level.text;
    speak(level.text);

    const closet = document.getElementById('closet');
    closet.innerHTML = '';
    
    let choices = [level.need];
    while(choices.length < 6) {
        let r = allClothes[Math.floor(Math.random() * allClothes.length)];
        if(!choices.includes(r)) choices.push(r);
    }
    choices.sort(() => Math.random() - 0.5);

    choices.forEach(item => {
        let btn = document.createElement('button');
        btn.className = 'clothing-btn';
        btn.innerText = item;
        btn.onclick = () => {
            if(item === currentTarget) {
                handleWin();
            } else {
                handleFail(btn);
            }
        };
        closet.appendChild(btn);
    });
}

function handleWin() {
    speak("Great job! You picked the right one.");
    document.getElementById('activeAvatar').style.transform = "scale(1.15) translateY(-20px)";
    setTimeout(() => {
        document.getElementById('activeAvatar').style.transform = "scale(1) translateY(0)";
        startNewLevel();
    }, 1500);
}

function handleFail(btn) {
    speak("Not quite. Look at the weather!");
    btn.animate([{transform:'rotate(0)'},{transform:'rotate(-10deg)'},{transform:'rotate(10deg)'},{transform:'rotate(0)'}], {duration: 300});
}

function speak(t) {
    window.speechSynthesis.cancel();
    const m = new SpeechSynthesisUtterance(t);
    m.rate = 1;
    window.speechSynthesis.speak(m);
}

})();
</script>
</body>
</html>
