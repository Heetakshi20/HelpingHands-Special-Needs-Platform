<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Blue Ribbon Blitz | HelpingHands Galaxy</title>
<link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:#02040a;color:white;min-height:100vh;overflow:hidden;}

/* --- Starry Background (Original Layout) --- */
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle var(--d) infinite alternate;}
@keyframes twinkle{0%{opacity:.1;transform:scale(.8)}100%{opacity:.8;transform:scale(1.3)}}

/* --- Navbar --- */
.navbar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:#0D5791;position:sticky;top:0;z-index:100;}
.logo{font-family:'Outfit',sans-serif;font-size:24px;font-weight:900; color: white;}
.logo span{color:#7CE04A;}
.back-link {background:#9c27b0; color:white; text-decoration:none; padding:8px 18px; border-radius:20px; font-weight:700; display:flex; align-items:center; gap:6px;}

/* --- Game Stage --- */
.container{position:relative;z-index:10;padding:10px;max-width:800px;margin:0 auto;}
.game-viewport {
    width: 100%; height: 450px; 
    background: radial-gradient(circle, #1a237e 0%, #050508 100%);
    border: 4px solid #33b5e5; border-radius: 25px;
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: space-around; padding-bottom: 40px;
}

/* Character (The Boy) */
.character {
    position: absolute; top: 80px; left: 40px; font-size: 4.5rem;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
    animation: floating 3s infinite ease-in-out;
}
@keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

/* Blue Ribbon Badge */
.ribbon-badge {
    position: absolute; top: 20px; right: 20px; font-size: 3rem;
    filter: drop-shadow(0 0 10px #33b5e5);
    animation: pulse 2s infinite;
}
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } }

/* Size Objects */
.size-object {
    cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
    position: relative;
}
.size-object:hover { transform: scale(1.05); }
.size-object.correct { animation: winScale 0.8s forwards; }

@keyframes winScale { 
    0% { transform: scale(1); } 
    50% { transform: scale(1.3); filter: brightness(1.5) drop-shadow(0 0 20px #7ce04a); }
    100% { transform: scale(1); }
}

/* UI Elements */
.hud { position: absolute; top: 20px; left: 20px; font-family: 'Outfit'; background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 30px; border: 2px solid #33b5e5; }
.instruction-bubble { 
    position: absolute; top: 110px; left: 130px; 
    background: white; color: #000; padding: 12px 25px; 
    border-radius: 20px; font-weight: 900; font-family: 'Outfit';
    box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
}
.instruction-bubble::after {
    content: ''; position: absolute; left: -15px; top: 20px;
    border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 15px solid white;
}

/* Play Overlay */
#playOverlay { position: fixed; inset: 0; background: rgba(2, 4, 10, 0.98); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.play-btn { background: #33b5e5; color: white; padding: 20px 70px; font-size: 2rem; border-radius: 60px; font-family: 'Outfit'; border: none; cursor: pointer; font-weight: 900; box-shadow: 0 10px 30px rgba(51, 181, 229, 0.4); }
</style>
</head>
<body>

<div id="playOverlay">
    <h1 style="font-family:'Outfit'; font-size: 3rem; margin-bottom: 25px; color:#33b5e5;">🎗️ BLUE RIBBON BLITZ</h1>
    <button class="play-btn" onclick="startGame()">START BLITZ!</button>
</div>

<div id="stars"></div>

<nav class="navbar">
  <div class="logo">Ribbon <span>Blitz</span></div>
  <a href="../dyslexia.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
</nav>

<div class="container">
  <div class="game-viewport" id="viewport">
      <div class="hud">🎗️ Ribbons: <span id="score">0</span></div>
      
      <div class="character">👦</div>
      <div class="instruction-bubble" id="taskText">Tap the Biggest!</div>
      
      <div class="ribbon-badge">🎗️</div>
      
      <div id="object-container" style="width: 100%; display: flex; align-items: flex-end; justify-content: space-around; padding: 0 50px;"></div>
  </div>
</div>

<script>
(function(){
var sc=document.getElementById('stars');
for(var i=0;i<100;i++){var s=document.createElement('div');s.className='star';var sz=Math.random()*2;s.style.cssText='width:'+sz+'px;height:'+sz+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;--d:'+(Math.random()*3+1.5)+'s';sc.appendChild(s);}

let score = 0;
let targetSize = 'big'; // or 'small'
const emojiPool = ['🍎', '🚗', '🧸', '🦖', '🧁', '🚀', '🐘', '🐱'];

window.startGame = function() {
    document.getElementById('playOverlay').style.display = 'none';
    generateLevel();
};

function generateLevel() {
    const container = document.getElementById('object-container');
    container.innerHTML = '';
    
    // Pick a random emoji for this round
    const emoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
    
    // Choose if we are looking for BIG or SMALL
    targetSize = Math.random() > 0.5 ? 'big' : 'small';
    document.getElementById('taskText').innerText = "Find the " + (targetSize === 'big' ? "BIGGEST" : "SMALLEST") + "!";
    speak("Find the " + targetSize + " one!");

    // Create 3 sizes
    const sizes = [
        { label: 'small', px: 60 },
        { label: 'medium', px: 110 },
        { label: 'big', px: 180 }
    ];

    // Shuffle sizes so they aren't always in order
    sizes.sort(() => Math.random() - 0.5);

    sizes.forEach(s => {
        const div = document.createElement('div');
        div.className = 'size-object';
        div.style.fontSize = s.px + 'px';
        div.innerHTML = emoji;
        
        div.onclick = () => {
            if(s.label === targetSize) {
                handleWin(div);
            } else {
                handleMistake(div);
            }
        };
        container.appendChild(div);
    });
}

function handleWin(el) {
    score++;
    document.getElementById('score').innerText = score;
    el.classList.add('correct');
    speak("Winner! Blue Ribbon for you!");
    
    setTimeout(() => {
        el.classList.remove('correct');
        generateLevel();
    }, 1200);
}

function handleMistake(el) {
    el.animate([
        { transform: 'rotate(0)' },
        { transform: 'rotate(-10deg)' },
        { transform: 'rotate(10deg)' },
        { transform: 'rotate(0)' }
    ], { duration: 300 });
    speak("Try again! Which one is " + targetSize + "?");
}

function speak(t) {
    window.speechSynthesis.cancel();
    const m = new SpeechSynthesisUtterance(t);
    m.rate = 1;
    window.speechSynthesis.speak(m);
}

})();
</script>
</body>
</html>
