<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Space Golf | UFO Puzzle</title>
<link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:#050a18;color:white;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;}

#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}
.star-bg{position:absolute;background:white;border-radius:50%;animation:twinkle var(--d) infinite alternate;}
@keyframes twinkle{0%{opacity:.2;} 100%{opacity:.8;}}

/* --- Consistent Navbar --- */
.navbar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:#0D5791;margin-bottom:10px;z-index:100;}
.logo{font-family:'Outfit',sans-serif;font-size:1.6rem;color:#ffeb3b;}
.exit-btn{background:#f44336;color:white;text-decoration:none;padding:10px 20px;border-radius:30px;font-weight:bold;font-size:0.9rem;}

.instr-bar{background:#ffeb3b;color:#0D5791;padding:12px 30px;border-radius:50px;font-weight:900;margin-bottom:15px;font-size:1.1rem;box-shadow:0 4px 10px rgba(0,0,0,0.3);}

/* --- Game Canvas --- */
#gameContainer {
    position: relative; width: 600px; height: 400px;
    border: 6px solid #7ce04a; border-radius: 20px;
    background: rgba(255,255,255,0.05); overflow: hidden;
}
canvas { display: block; cursor: crosshair; }

.ui-text { position: absolute; top: 10px; font-family: 'Outfit'; z-index: 5; }
#level-txt { left: 20px; color: #ffeb3b; }
#shots-txt { right: 20px; color: #7ce04a; }

.win-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.8);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10; border-radius: 14px; text-align: center;
}
.next-btn { background: #7ce04a; color: black; padding: 15px 40px; border-radius: 50px; font-weight: 900; border: none; cursor: pointer; font-size: 1.2rem; margin-top: 15px; }
</style>
</head>
<body>

<div id="stars"></div>

<nav class="navbar">
    <div class="logo">🛸 UFO PUZZLE: GOLF</div>
    <div style="display: flex; align-items: center; gap: 20px;">
        <a href="../down_syndrome.html" class="exit-btn">EXIT GAME</a>
    </div>
</nav>

<div class="instr-bar" id="status">Pull back the ball and let go to shoot!</div>

<div id="gameContainer">
    <div id="level-txt" class="ui-text">Planet 1</div>
    <div id="shots-txt" class="ui-text">Shots: 0</div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="winOverlay" class="win-overlay">
        <h1 style="font-size: 2.5rem; color: #ffeb3b; font-family: 'Outfit';">HOLE IN ONE! 🌟</h1>
        <button class="next-btn" onclick="nextLevel()">NEXT PLANET 🚀</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const winOverlay = document.getElementById('winOverlay');
const statusText = document.getElementById('status');

canvas.width = 600;
canvas.height = 400;

let level = 1;
let shots = 0;
let isDragging = false;
let ball = { x: 100, y: 300, radius: 12, vx: 0, vy: 0, friction: 0.98 };
let hole = { x: 500, y: 300, radius: 25 };
let dragStart = { x: 0, y: 0 };
let obstacles = [];

function setupStars() {
    const sc = document.getElementById('stars');
    for(let i=0; i<80; i++){
        let s = document.createElement('div');
        s.className = 'star-bg';
        let sz = Math.random()*3;
        s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${Math.random()*3+1}s`;
        sc.appendChild(s);
    }
}

function initLevel() {
    winOverlay.style.display = 'none';
    ball.x = 80; ball.y = 200;
    ball.vx = 0; ball.vy = 0;
    shots = 0;
    document.getElementById('shots-txt').innerText = "Shots: 0";
    document.getElementById('level-txt').innerText = "Planet " + level;
    
    // Set hole position based on level
    hole.x = 450 + (Math.random() * 50);
    hole.y = 100 + (Math.random() * 200);

    // Obstacles (Space Rocks)
    obstacles = [];
    if(level > 1) {
        obstacles.push({ x: 300, y: 150, w: 30, h: 100 });
    }
    speak("Target found! Planet " + level);
    animate();
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    // Only allow drag if ball is still
    if (Math.abs(ball.vx) < 0.2 && Math.abs(ball.vy) < 0.2) {
        let dist = Math.hypot(mx - ball.x, my - ball.y);
        if (dist < 30) {
            isDragging = true;
            dragStart = { x: mx, y: my };
        }
    }
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
});

window.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let dx = dragStart.x - mx;
    let dy = dragStart.y - my;
    
    ball.vx = dx * 0.15; // Power multiplier
    ball.vy = dy * 0.15;
    
    isDragging = false;
    shots++;
    document.getElementById('shots-txt').innerText = "Shots: " + shots;
    speak("Shot!");
});

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Hole (Black Hole)
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.strokeStyle = '#7ce04a';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Draw Obstacles
    ctx.fillStyle = '#4fc3f7';
    obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));

    // Draw Aim Line
    if (isDragging) {
        // We'll add mouse move listener to update line
    }

    // Ball Physics
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= ball.friction;
    ball.vy *= ball.friction;

    // Boundary Bounce
    if (ball.x < ball.radius || ball.x > canvas.width - ball.radius) ball.vx *= -1;
    if (ball.y < ball.radius || ball.y > canvas.height - ball.radius) ball.vy *= -1;

    // Obstacle Bounce
    obstacles.forEach(o => {
        if (ball.x + ball.radius > o.x && ball.x - ball.radius < o.x + o.w &&
            ball.y + ball.radius > o.y && ball.y - ball.radius < o.y + o.h) {
            ball.vx *= -1; ball.vy *= -1;
        }
    });

    // Draw Ball (The Star Ball)
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ffeb3b';
    ctx.fill();

    // Check Win
    let distToHole = Math.hypot(ball.x - hole.x, ball.y - hole.y);
    if (distToHole < hole.radius) {
        ball.vx = 0; ball.vy = 0;
        winOverlay.style.display = 'flex';
        speak("Fantastic! Goal!");
        return; // Stop animation
    }

    requestAnimationFrame(animate);
}

window.nextLevel = function() {
    level++;
    initLevel();
}

function speak(t) {
    window.speechSynthesis.cancel();
    const m = new SpeechSynthesisUtterance(t);
    window.speechSynthesis.speak(m);
}

setupStars();
initLevel();
</script>
</body>
</html>
