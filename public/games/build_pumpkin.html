<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Real Carver | UFO Puzzle</title>
<link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{font-family:'Nunito',sans-serif;background:#0d0221;color:white;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;}

#stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

.navbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #2e1a47; border-bottom: 3px solid #ff9800; z-index: 100;}
.logo { font-family: 'Outfit', sans-serif; font-size: 1.6rem; color: #ffeb3b; }
.exit-btn { background: #f44336; color: white; text-decoration: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; }

.instr-bar { background: #ff9800; color: #0d0221; padding: 12px 30px; border-radius: 50px; font-weight: 900; margin: 15px 0; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center;}

/* --- The Realistic Pumpkin Stage --- */
#game-stage {
    position: relative; width: 600px; height: 350px;
    display: flex; align-items: center; justify-content: center;
}

/* The Light Inside the Pumpkin */
#candle-light {
    position: absolute; width: 200px; height: 150px;
    background: radial-gradient(circle, #fff700 0%, #ff9800 70%, transparent 100%);
    border-radius: 50%; filter: blur(10px); opacity: 0; transition: opacity 0.5s;
}

/* The Pumpkin Skin (The layer we "cut") */
#pumpkin-skin {
    width: 300px; height: 250px; background: #ff6d00;
    border: 6px solid #e65100; border-radius: 50% 50% 45% 45%;
    position: relative; cursor: crosshair;
    box-shadow: inset -20px -20px 40px rgba(0,0,0,0.3);
    z-index: 2; display: none;
}

/* The Stem */
#pumpkin-skin::after {
    content: ''; position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    width: 35px; height: 45px; background: #4e342e; border-radius: 5px;
}

/* A Carved Hole */
.carved-hole {
    position: absolute; background: #0d0221; /* Matches background to look like a hole */
    transform: translate(-50%, -50%); border-radius: 4px;
    box-shadow: inset 0 0 10px #ffeb3b, 0 0 15px #ffeb3b; /* Glowing edges */
    pointer-events: none;
}

/* --- Tray UI --- */
.tray {
    width: 90%; max-width: 600px; background: rgba(255,255,255,0.1);
    padding: 15px; margin-top: 15px; border-radius: 20px;
    display: flex; gap: 15px; justify-content: center; border: 2px solid #ff9800;
}

.step-panel { display: none; gap: 15px; align-items: center; }
.step-panel.active { display: flex; }

.item {
    width: 70px; height: 70px; background: #331a4d; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 2rem; border: 3px solid #ff9800; color: #ff9800;
}

.next-btn {
    background: #ff9800; color: #000; padding: 12px 25px; 
    border-radius: 50px; font-weight: 900; border: none; cursor: pointer;
}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<nav class="navbar">
    <div class="logo">🎃 REAL PUMPKIN CARVER</div>
    <a href="../autism.html" class="exit-btn">EXIT</a>
</nav>

<div class="instr-bar" id="status">Step 1: Pick your Pumpkin!</div>

<div id="game-stage">
    <div id="candle-light"></div>
    <div id="pumpkin-skin" onclick="carve(event)"></div>
</div>

<div class="tray">
    <div id="step1" class="step-panel active">
        <div class="item" onclick="startPumpkin('50% 50% 45% 45%')">🟠</div>
        <div class="item" onclick="startPumpkin('40% 40% 40% 40% / 60% 60% 40% 40%')">🏮</div>
    </div>

    <div id="step2" class="step-panel">
        <div class="item" onclick="lightCandle('#fff700')">🟡</div>
        <div class="item" onclick="lightCandle('#7cfc00')">🟢</div>
    </div>

    <div id="step3" class="step-panel">
        <div class="item" onclick="setTool('triangle')">▲</div>
        <div class="item" onclick="setTool('circle')">●</div>
        <div class="item" onclick="setTool('mouth')">◡</div>
        <button class="next-btn" onclick="location.reload()">DONE!</button>
    </div>

    <button id="main-next" class="next-btn" onclick="nextStep()" style="display:none;">NEXT STEP ➡️</button>
</div>

<script>
let currentStep = 1;
let tool = '';
let glowColor = '#fff700';
const skin = document.getElementById('pumpkin-skin');
const light = document.getElementById('candle-light');

function startPumpkin(radius) {
    skin.style.display = 'block';
    skin.style.borderRadius = radius;
    document.getElementById('main-next').style.display = 'block';
    speak("Good choice! Now let's light it up.");
}

function lightCandle(color) {
    glowColor = color;
    light.style.background = `radial-gradient(circle, ${color} 0%, #ff9800 70%, transparent 100%)`;
    light.style.opacity = '1';
    document.getElementById('main-next').style.display = 'block';
    speak("It's glowing! Ready to carve?");
}

function setTool(t) {
    tool = t;
    speak("Tap the pumpkin to cut a " + t + " hole!");
}

function carve(e) {
    if (currentStep !== 3 || !tool) return;

    const rect = skin.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const hole = document.createElement('div');
    hole.className = 'carved-hole';
    hole.style.left = x + 'px';
    hole.style.top = y + 'px';
    hole.style.boxShadow = `inset 0 0 10px ${glowColor}, 0 0 15px ${glowColor}`;

    // Shape logic
    if (tool === 'triangle') {
        hole.style.width = '0'; hole.style.height = '0';
        hole.style.borderLeft = '20px solid transparent';
        hole.style.borderRight = '20px solid transparent';
        hole.style.borderBottom = `35px solid ${glowColor}`;
        hole.style.background = 'transparent';
        hole.style.boxShadow = 'none';
    } else if (tool === 'circle') {
        hole.style.width = '30px'; hole.style.height = '30px';
        hole.style.borderRadius = '50%'; hole.style.background = glowColor;
    } else {
        hole.style.width = '60px'; hole.style.height = '30px';
        hole.style.borderRadius = '0 0 50px 50px'; hole.style.background = glowColor;
    }

    skin.appendChild(hole);
    
    // "Crunch" sound effect via vibration and speech
    if (navigator.vibrate) navigator.vibrate(50);
    speak("Snip!");
}

function nextStep() {
    document.getElementById(`step${currentStep}`).classList.remove('active');
    currentStep++;
    document.getElementById(`step${currentStep}`).classList.add('active');
    document.getElementById('main-next').style.display = 'none';

    if (currentStep === 2) document.getElementById('status').innerText = "Step 2: Pick a candle light!";
    if (currentStep === 3) document.getElementById('status').innerText = "Step 3: Tap to cut the pumpkin!";
    speak(document.getElementById('status').innerText);
}

function speak(t) {
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
}

// Spooky Background Stars
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0; i<40; i++) {
        ctx.fillStyle = "#ff9800";
        ctx.beginPath();
        ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*2, 0, Math.PI*2);
        ctx.fill();
    }
    setTimeout(() => requestAnimationFrame(draw), 300);
}
draw();

speak("Let's carve a pumpkin! Step 1: Pick a pumpkin shape.");
</script>
</body>
</html>
