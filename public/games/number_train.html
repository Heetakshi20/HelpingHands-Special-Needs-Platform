<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Number Train | Connect the Dots</title>
<link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;}
body{font-family:'Nunito',sans-serif;background:#02040a;color:white;min-height:100vh;overflow:hidden;}

#stars-bg {position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.star-bg {position:absolute;background:white;border-radius:50%;opacity:0.3;}

.navbar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:#0D5791;position:relative;z-index:100;border-bottom:3px solid #7CE04A;}
.logo{font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;}
.logo span{color:#7CE04A;}
.back-btn{background:#00bcd4;color:white;text-decoration:none;padding:8px 18px;border-radius:20px;font-weight:700;display:flex;align-items:center;gap:8px;}

.game-container {position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:20px;height:calc(100vh - 70px);}
.instr{background:rgba(0,60,80,.6);padding:10px 20px;border-radius:30px;color:#80deea;font-weight:900;margin-bottom:15px;border:1px solid #00bcd4;}

#canvas-wrap {
    position: relative; width: 95vw; height: 60vh; max-width: 600px;
    background: rgba(255,255,255,0.05); border-radius: 20px; border: 2px dashed rgba(0,229,255,0.3);
}
canvas { position: absolute; top:0; left:0; width:100%; height:100%; }

.dot {
    position: absolute; width: 32px; height: 32px; background: #003d52;
    border: 2px solid #00bcd4; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-family: 'Outfit';
    font-weight: 900; color: #00e5ff; font-size: 13px; cursor: pointer;
    z-index: 20; transform: translate(-50%, -50%); transition: all 0.2s;
}
.dot.active { background: #7CE04A; color: #000; border-color: #fff; transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 15px #7CE04A; }

.win-banner{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:linear-gradient(135deg,#0a4a82,#003d52);border:3px solid #00e5ff;border-radius:28px;padding:30px;text-align:center;box-shadow:0 0 60px rgba(0,229,255,.5);width:80%;max-width:400px;}
.win-banner.show{display:block; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
@keyframes popIn { from {transform:translate(-50%, -50%) scale(0.5); opacity:0;} to {transform:translate(-50%, -50%) scale(1); opacity:1;} }
.win-btn{background:#7CE04A; color:#000; border:none; padding:12px 25px; border-radius:20px; font-weight:900; margin-top:15px; cursor:pointer;}
</style>
</head>
<body>
<div id="stars-bg"></div>
<nav class="navbar">
    <div class="logo">Number<span>Train</span></div>
    <a href="../down_syndrome.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
</nav>

<div class="game-container">
    <div class="instr" id="instr">Connect dots 1 to 20!</div>
    
    <div id="canvas-wrap">
        <canvas id="lineCanvas"></canvas>
        <div id="dots-layer"></div>
    </div>

    <div id="winBanner" class="win-banner">
        <h2 style="color:#00e5ff; font-family:'Outfit';">CHOO CHOO! 🚂</h2>
        <p>You connected the Number Train track!</p>
        <button class="win-btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<script>
const canvas = document.getElementById('lineCanvas');
const ctx = canvas.getContext('2d');
const dotsLayer = document.getElementById('dots-layer');
const instr = document.getElementById('instr');

let dots = [];
let nextDot = 1;
const totalDots = 20;

function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    if(nextDot > 1) drawLines();
}

function generateDots() {
    dots = [];
    // We create a "track" path using points
    for(let i=0; i<totalDots; i++) {
        // Creates a wavy train track path
        dots.push({
            id: i + 1,
            x: (10 + (i % 5) * 20) * (canvas.width / 100),
            y: (15 + Math.floor(i / 5) * 22 + (i % 2 === 0 ? 5 : 0)) * (canvas.height / 100)
        });
    }
}

function renderDots() {
    dotsLayer.innerHTML = '';
    dots.forEach(dot => {
        const div = document.createElement('div');
        div.className = 'dot';
        div.id = `dot-${dot.id}`;
        div.style.left = dot.x + 'px';
        div.style.top = dot.y + 'px';
        div.innerText = dot.id;
        div.onclick = () => handleTap(dot.id);
        dotsLayer.appendChild(div);
    });
}

function handleTap(id) {
    if (id === nextDot) {
        document.getElementById(`dot-${id}`).classList.add('active');
        speak(id);
        
        if (nextDot > 1) drawLines();
        
        nextDot++;
        if (nextDot > totalDots) {
            instr.innerText = "Train Track Completed!";
            document.getElementById('winBanner').classList.add('show');
            speak("Choo Choo! You finished the number train!");
        } else {
            instr.innerText = `Find number ${nextDot}`;
        }
    } else {
        const el = document.getElementById(`dot-${id}`);
        el.style.borderColor = "#f44336";
        setTimeout(() => el.style.borderColor = "#00bcd4", 500);
        speak("Try looking for " + nextDot);
    }
}

function drawLines() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.beginPath();
    ctx.strokeStyle = '#7CE04A';
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#7CE04A';

    for(let i=0; i < nextDot - 1; i++) {
        const dot = dots[i];
        if (i === 0) ctx.moveTo(dot.x, dot.y);
        else ctx.lineTo(dot.x, dot.y);
    }
    ctx.stroke();
}

function speak(t) {
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
}

// Background stars
const bg = document.getElementById('stars-bg');
for(let i=0; i<100; i++) {
    const s = document.createElement('div');
    s.className = 'star-bg';
    s.style.width = s.style.height = Math.random()*2+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    bg.appendChild(s);
}

window.addEventListener('resize', resize);
setTimeout(() => {
    resize();
    generateDots();
    renderDots();
}, 200);

</script>
</body>
</html>
