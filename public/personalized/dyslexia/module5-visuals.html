<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 5 - Visual Learning</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      /* Dyslexia-Friendly Variables */
      :root {
        --bg-color: #FDFBF7; 
        --text-color: #2D3748; 
        --card-bg: #FFFFFF;
        --accent-color: #4A90E2; 
        --success-color: #48BB78;
        --error-color: #ED8936; /* Warm orange instead of harsh red */
        
        /* Specific Visual Learning Colors */
        --onset-color: #3182CE; /* Blue for start of word */
        --rime-color: #E53E3E;  /* Red for end/vowel part of word */
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        font-family: 'Lexend', sans-serif; 
        background-color: var(--bg-color); 
        color: var(--text-color);
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        letter-spacing: 0.8px; 
        line-height: 1.8; 
      }
      
      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background-color: var(--accent-color); color: white; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
      .logo { font-size: 28px; font-weight: 800; cursor: pointer; letter-spacing: 1px;}
      .logo span { color: #FFD166; }
      .nav-links { list-style: none; display: flex; gap: 30px; }
      .nav-links a { text-decoration: none; color: white; font-weight: 600; padding: 10px 20px; border-radius: 8px; transition: 0.3s; font-size: 1.1rem; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.2); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: var(--card-bg); border-radius: 24px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05); border: 4px solid #E2E8F0; }

      /* Header */
      .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 3px solid #E2E8F0; padding-bottom: 20px; }
      .header-icon { width: 60px; height: 60px; background: var(--accent-color); border-radius: 16px; color: white; font-size: 2rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: var(--text-color); font-weight: 800; font-size: 2rem; }

      /* Instruction Bar */
      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #EBF8FF; padding: 25px 35px; border-radius: 16px; margin-bottom: 30px; border: 3px solid #90CDF4; }
      .question-text { font-size: 1.6rem; font-weight: 600; color: var(--text-color); flex: 1; }
      
      .speaker-icon { width: 65px; height: 65px; background: var(--accent-color); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(74, 144, 226, 0.3); flex-shrink: 0; margin-left: 20px; }
      .speaker-icon:hover { transform: scale(1.1); background: #357ABD; }

      /* Visual Prompt Area */
      .visual-box { background: #FAFAFA; border: 3px dashed #CBD5E0; border-radius: 20px; padding: 30px; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; animation: fade-in 0.5s ease; text-align: center; }
      
      .huge-emoji { font-size: 7rem; margin-bottom: 10px; }
      
      .story-sentence { font-size: 2rem; font-weight: 600; color: var(--text-color); display: flex; align-items: center; gap: 15px; cursor: pointer; padding: 15px 25px; border-radius: 16px; transition: background 0.2s; }
      .story-sentence:hover { background: #E2E8F0; }

      /* Options Grid */
      .options-grid { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; width: 100%; margin-bottom: 20px; }
      
      /* Card Styling (Adapts for words vs images) */
      .option-card { background: #fff; border: 4px solid #E2E8F0; border-radius: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.05); user-select: none; }
      .option-card:hover { border-color: var(--accent-color); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(74, 144, 226, 0.15); }
      .option-card:active { transform: translateY(0); }

      /* Word Flashcards */
      .word-card { width: 220px; padding: 30px 10px; font-size: 3.5rem; font-weight: 800; }
      .chunk-onset { color: var(--onset-color); }
      .chunk-rime { color: var(--rime-color); }

      /* Image Story Cards */
      .image-card { width: 220px; padding: 25px 15px; font-size: 5rem; }

      /* Feedback States */
      .option-card.correct { background: #F0FFF4; border-color: var(--success-color); animation: pop-in 0.5s ease; pointer-events: none; }
      .option-card.incorrect { background: #FFFAF0; border-color: var(--error-color); opacity: 0.7; pointer-events: none; transform: scale(0.98); }

      .feedback { text-align: center; font-size: 1.6rem; font-weight: 800; min-height: 40px; margin-top: 10px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: var(--success-color); }
      .feedback.incorrect-text { color: var(--error-color); }

      /* Controls */
      .next-btn { background: var(--success-color); color: white; border: none; border-radius: 12px; padding: 15px 40px; font-weight: 800; font-size: 1.4rem; cursor: pointer; display: block; margin: 30px auto 0; transition: all 0.3s ease; display: none; }
      .next-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(72, 187, 120, 0.4); }

      .score-box { display: none; margin-top: 30px; background: #F0FFF4; border: 4px solid #9AE6B4; border-radius: 20px; padding: 40px; text-align: center; font-weight: 800; font-size: 2.2rem; color: var(--success-color); }

      /* Animations */
      @keyframes pop-in { 0% { transform: scale(0.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
      @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      /* Footer */
      .footer { background-color: var(--text-color); color: white; padding: 25px; text-align: center; margin-top: auto; font-size: 1rem; }

      @media(max-width: 600px) {
        .word-card, .image-card { width: 140px; }
        .word-card { font-size: 2.2rem; padding: 20px 5px; }
        .image-card { font-size: 3.5rem; padding: 15px; }
        .huge-emoji { font-size: 5rem; }
        .story-sentence { font-size: 1.4rem; padding: 10px; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index3.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index3.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🎨</div>
          <h2>Module 5: Visual Learning</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="visual-box" id="visualBox">
          </div>

        <div class="options-grid" id="optionsGrid">
          </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
          Next Activity ➡️
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // Curriculum Data: Mix of Color-Coded Word Flashcards and Image Storytelling
      const questions = [
        {
          type: "flashcard",
          instruction: "Look at the picture. Tap the matching color-coded flashcard.",
          visual: "🐸",
          targetAudio: "Frog.",
          options: [
            { onset: "fr", rime: "og", plainText: "frog", isCorrect: true },
            { onset: "d", rime: "og", plainText: "dog", isCorrect: false },
            { onset: "l", rime: "og", plainText: "log", isCorrect: false }
          ]
        },
        {
          type: "flashcard",
          instruction: "Let's try another flashcard. Find the matching word.",
          visual: "🦇",
          targetAudio: "Bat.",
          options: [
            { onset: "c", rime: "at", plainText: "cat", isCorrect: false },
            { onset: "h", rime: "at", plainText: "hat", isCorrect: false },
            { onset: "b", rime: "at", plainText: "bat", isCorrect: true }
          ]
        },
        {
          type: "story",
          instruction: "Listen to the sentence. Pick the picture that tells the story.",
          sentence: "The little bird is singing in the tree.",
          options: [
            { emoji: "🌳🐦🎶", altText: "Bird in tree", isCorrect: true },
            { emoji: "🦅☁️", altText: "Eagle in clouds", isCorrect: false }
          ]
        },
        {
          type: "story",
          instruction: "Listen carefully. Pick the picture that matches.",
          sentence: "The dog is sleeping on the rug.",
          options: [
            { emoji: "🐕🏃‍♂️", altText: "Dog running", isCorrect: false },
            { emoji: "🐕💤", altText: "Dog sleeping", isCorrect: true }
          ]
        }
      ];

      let currentIdx = 0;
      let currentQuestion = null;
      let isAnswered = false;

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const visualBox = document.getElementById("visualBox");
      const optionsGrid = document.getElementById("optionsGrid");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function
      function speakText(text, rate = 0.85) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = rate; 
        window.speechSynthesis.speak(utterance);
      }

      function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
      }

      function loadQuestion() {
        currentQuestion = questions[currentIdx];
        isAnswered = false;
        
        // Reset UI
        questionTextEl.textContent = currentQuestion.instruction;
        visualBox.innerHTML = "";
        optionsGrid.innerHTML = "";
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";

        // Setup Layout based on Activity Type
        if (currentQuestion.type === "flashcard") {
          setupFlashcardActivity();
        } else if (currentQuestion.type === "story") {
          setupStoryActivity();
        }

        // Auto-read main instruction
        setTimeout(() => speakText(currentQuestion.instruction), 500);
      }

      function setupFlashcardActivity() {
        // Visual Prompt: Large Emoji
        visualBox.innerHTML = `
          <div class="huge-emoji">${currentQuestion.visual}</div>
          <div style="font-size:1.2rem; color:#718096; font-weight:600;">What is this?</div>
        `;

        // Options: Color-coded words
        const shuffledOptions = shuffleArray(currentQuestion.options);
        shuffledOptions.forEach(option => {
          const card = document.createElement("div");
          card.className = "option-card word-card";
          
          card.innerHTML = `
            <div>
              <span class="chunk-onset">${option.onset}</span><span class="chunk-rime">${option.rime}</span>
            </div>
          `;
          
          card.onclick = () => handleAnswerClick(card, option.plainText, option.isCorrect);
          optionsGrid.appendChild(card);
        });
      }

      function setupStoryActivity() {
        // Visual Prompt: Sentence they can click to hear
        visualBox.innerHTML = `
          <div class="story-sentence" onclick="speakText('${currentQuestion.sentence}')" title="Listen to sentence">
            <i class="fas fa-play-circle" style="color:var(--accent-color)"></i>
            ${currentQuestion.sentence}
          </div>
        `;

        // Options: Image/Emoji Story Cards
        const shuffledOptions = shuffleArray(currentQuestion.options);
        shuffledOptions.forEach(option => {
          const card = document.createElement("div");
          card.className = "option-card image-card";
          card.innerHTML = option.emoji;
          card.onclick = () => handleAnswerClick(card, option.altText, option.isCorrect);
          optionsGrid.appendChild(card);
        });

        // Automatically read the sentence after the instruction
        setTimeout(() => speakText(currentQuestion.sentence), 3000);
      }

      function handleAnswerClick(cardElement, spokenText, isCorrect) {
        if (isAnswered) return;

        // Speak the option they clicked (Provides auditory feedback for the visual chunk/image)
        speakText(spokenText); 

        if (!isCorrect) {
          cardElement.classList.add("incorrect");
          
          setTimeout(() => {
             speakText("Let's look closely and try again.");
             feedbackEl.textContent = "Let's try again! 🔍";
             feedbackEl.className = "feedback show incorrect-text";
          }, 800); 
          return;
        }

        // Correct Selection
        isAnswered = true;
        Array.from(optionsGrid.children).forEach(btn => btn.style.pointerEvents = "none");
        cardElement.classList.add("correct");
        
        setTimeout(() => {
          feedbackEl.className = "feedback show correct-text";
          feedbackEl.textContent = "⭐ Excellent visual matching!";
          speakText("Excellent visual matching! That is correct.");
          setTimeout(() => nextBtn.style.display = "block", 1500);
        }, 800);
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Module
          document.querySelector(".question-bar").style.display = "none";
          visualBox.style.display = "none";
          optionsGrid.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `You have eagle eyes!<br>You finished the Visual Learning module! 🦅🎨`;
          speakText(`You have eagle eyes! You finished the Visual Learning module.`);
        }
      }

      // Initialize
      loadQuestion();
    </script>
  </body>
</html>
