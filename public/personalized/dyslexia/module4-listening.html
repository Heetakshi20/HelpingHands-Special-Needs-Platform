<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 4 - Listening & Comprehension</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      /* Dyslexia-Friendly Variables */
      :root {
        --bg-color: #FDFBF7; 
        --text-color: #2D3748; 
        --card-bg: #FFFFFF;
        --accent-color: #4A90E2; 
        --success-color: #48BB78;
        --error-color: #ED8936; /* Warm orange instead of harsh red */
        --highlight: #FEFCBF;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        font-family: 'Lexend', sans-serif; 
        background-color: var(--bg-color); 
        color: var(--text-color);
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        letter-spacing: 0.8px; 
        line-height: 1.8; 
      }
      
      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background-color: var(--accent-color); color: white; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
      .logo { font-size: 28px; font-weight: 800; cursor: pointer; letter-spacing: 1px;}
      .logo span { color: #FFD166; }
      .nav-links { list-style: none; display: flex; gap: 30px; }
      .nav-links a { text-decoration: none; color: white; font-weight: 600; padding: 10px 20px; border-radius: 8px; transition: 0.3s; font-size: 1.1rem; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.2); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: var(--card-bg); border-radius: 24px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05); border: 4px solid #E2E8F0; }

      /* Header */
      .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 3px solid #E2E8F0; padding-bottom: 20px; }
      .header-icon { width: 60px; height: 60px; background: var(--accent-color); border-radius: 16px; color: white; font-size: 2rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: var(--text-color); font-weight: 800; font-size: 2rem; }

      /* Instruction Bar */
      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #EBF8FF; padding: 25px 35px; border-radius: 16px; margin-bottom: 30px; border: 3px solid #90CDF4; }
      .question-text { font-size: 1.6rem; font-weight: 600; color: var(--text-color); }
      
      .speaker-icon { width: 65px; height: 65px; background: var(--accent-color); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(74, 144, 226, 0.3); flex-shrink: 0; margin-left: 20px; }
      .speaker-icon:hover { transform: scale(1.1); background: #357ABD; }

      /* Story Player Box */
      .player-box { background: #FAFAFA; border: 3px dashed #CBD5E0; border-radius: 20px; padding: 30px; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
      
      .play-story-btn { background: var(--accent-color); color: white; border: none; border-radius: 50%; width: 100px; height: 100px; font-size: 3rem; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4); padding-left: 8px; /* Optical centering for play icon */ }
      .play-story-btn:hover { transform: scale(1.1); background: #3182CE; }
      .play-story-btn.playing { animation: pulse-blue 1.5s infinite; pointer-events: none; }
      
      .player-hint { font-size: 1.2rem; font-weight: 600; color: #718096; }

      /* Question/Activity Area */
      .activity-area { display: none; flex-direction: column; align-items: center; gap: 20px; animation: fade-in 0.8s ease; width: 100%; }
      .activity-area.show { display: flex; }
      
      .task-title { font-size: 1.6rem; font-weight: 800; color: #4A5568; display: flex; align-items: center; gap: 15px; text-align: center; }

      /* Options Grid (For both Q&A and Sequencing) */
      .options-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; width: 100%; margin-top: 10px; }
      
      .option-card { background: #fff; border: 4px solid #E2E8F0; border-radius: 20px; width: 180px; padding: 25px 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.05); position: relative; user-select: none; }
      .option-card:hover { border-color: var(--accent-color); transform: translateY(-5px); }
      .option-card:active { transform: translateY(0); }
      
      .option-emoji { font-size: 4.5rem; margin-bottom: 10px; }
      .option-text { font-size: 1.3rem; font-weight: 800; color: var(--text-color); }

      /* Sequence Badges */
      .sequence-badge { position: absolute; top: -15px; right: -15px; width: 40px; height: 40px; background: var(--accent-color); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: 800; border: 4px solid white; opacity: 0; transform: scale(0); transition: all 0.3s ease; }
      .option-card.selected .sequence-badge { opacity: 1; transform: scale(1); }
      .option-card.selected { border-color: var(--accent-color); background: #EBF8FF; pointer-events: none; }

      /* Status Feedback */
      .option-card.correct { background: #F0FFF4; border-color: var(--success-color); animation: pop-in 0.5s ease; pointer-events: none; }
      .option-card.incorrect { background: #FFFAF0; border-color: var(--error-color); opacity: 0.8; pointer-events: none; transform: scale(0.98); }

      .feedback { text-align: center; font-size: 1.5rem; font-weight: 800; min-height: 40px; margin-top: 20px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: var(--success-color); }
      .feedback.incorrect-text { color: var(--error-color); }

      /* Controls */
      .next-btn { background: var(--success-color); color: white; border: none; border-radius: 12px; padding: 15px 40px; font-weight: 800; font-size: 1.4rem; cursor: pointer; display: block; margin: 30px auto 0; transition: all 0.3s ease; display: none; }
      .next-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(72, 187, 120, 0.4); }

      .score-box { display: none; margin-top: 30px; background: #F0FFF4; border: 4px solid #9AE6B4; border-radius: 20px; padding: 40px; text-align: center; font-weight: 800; font-size: 2.2rem; color: var(--success-color); }

      /* Animations */
      @keyframes pop-in { 0% { transform: scale(0.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
      @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes gentle-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
      @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(74, 144, 226, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(74, 144, 226, 0); } 100% { box-shadow: 0 0 0 0 rgba(74, 144, 226, 0); } }

      /* Footer */
      .footer { background-color: var(--text-color); color: white; padding: 25px; text-align: center; margin-top: auto; font-size: 1rem; }

      @media(max-width: 600px) {
        .option-card { width: 140px; padding: 15px; }
        .option-emoji { font-size: 3.5rem; }
        .play-story-btn { width: 80px; height: 80px; font-size: 2.5rem; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index3.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index3.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🎧</div>
          <h2>Module 4: Listening & Stories</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="player-box" id="playerBox">
          <button class="play-story-btn" id="playBtn" onclick="playStory()">
            <i class="fas fa-play"></i>
          </button>
          <div class="player-hint" id="playerHint">Tap to listen to the story</div>
        </div>

        <div class="activity-area" id="activityArea">
          <div class="task-title" id="taskTitle">
            </div>
          
          <div class="options-grid" id="optionsGrid">
            </div>
          
          <div id="feedback" class="feedback"></div>
        </div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
          Next Story ➡️
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // Curriculum Data: Mix of Q&A and Story Sequencing
      const questions = [
        {
          type: "question",
          instruction: "Listen to the short story, then answer the question.",
          story: "Leo has a little dog. The dog is brown and loves to jump.",
          question: "What color is the dog?",
          options: [
            { text: "Brown", emoji: "🟤", isCorrect: true },
            { text: "Black", emoji: "⚫", isCorrect: false }
          ]
        },
        {
          type: "sequence",
          instruction: "Listen to the story. What happened First, Next, and Last?",
          story: "First, Mia planted a seed. Next, she gave it water. Last, a beautiful flower grew.",
          question: "Tap the pictures in the correct order:",
          sequenceOrder: [
            { text: "Seed", emoji: "🌱" },
            { text: "Water", emoji: "💧" },
            { text: "Flower", emoji: "🌻" }
          ]
        },
        {
          type: "question",
          instruction: "Listen carefully to find the answer.",
          story: "Sam was hungry. He went to the kitchen and ate a red apple.",
          question: "What did Sam eat?",
          options: [
            { text: "Apple", emoji: "🍎", isCorrect: true },
            { text: "Banana", emoji: "🍌", isCorrect: false }
          ]
        },
        {
          type: "sequence",
          instruction: "Put the morning routine in order.",
          story: "First, Tom woke up from bed. Next, he brushed his teeth. Last, he ate breakfast.",
          question: "What happened First, Next, and Last?",
          sequenceOrder: [
            { text: "Wake Up", emoji: "🛏️" },
            { text: "Brush", emoji: "🪥" },
            { text: "Eat", emoji: "🥣" }
          ]
        }
      ];

      let currentIdx = 0;
      let currentQuestion = null;
      let isAnswered = false;
      let userSequence = [];

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const playBtn = document.getElementById("playBtn");
      const playerHint = document.getElementById("playerHint");
      const activityArea = document.getElementById("activityArea");
      const taskTitle = document.getElementById("taskTitle");
      const optionsGrid = document.getElementById("optionsGrid");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function (Clear pacing)
      function speakText(text, rate = 0.85, onEndCallback = null) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = rate; 
        
        if (onEndCallback) {
          utterance.onend = onEndCallback;
        }
        
        window.speechSynthesis.speak(utterance);
      }

      function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
      }

      function loadQuestion() {
        currentQuestion = questions[currentIdx];
        isAnswered = false;
        userSequence = [];
        
        // Reset UI
        questionTextEl.textContent = currentQuestion.instruction;
        playBtn.className = "play-story-btn";
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        playerHint.textContent = "Tap to listen to the story";
        
        activityArea.classList.remove("show");
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";

        // Pre-build the activity area so it's ready when the story finishes
        taskTitle.innerHTML = `
          <button class="small-speaker" style="background:transparent; border:none; font-size:1.5rem; color:var(--accent-color); cursor:pointer;" onclick="speakText(currentQuestion.question)">
            <i class="fas fa-volume-up"></i>
          </button>
          <span>${currentQuestion.question}</span>
        `;

        optionsGrid.innerHTML = "";
        
        if (currentQuestion.type === "question") {
          const shuffledOptions = shuffleArray(currentQuestion.options);
          shuffledOptions.forEach((option) => {
            const card = createCard(option.emoji, option.text);
            card.onclick = () => handleQuestionClick(card, option);
            optionsGrid.appendChild(card);
          });
        } else if (currentQuestion.type === "sequence") {
          const shuffledSequence = shuffleArray(currentQuestion.sequenceOrder);
          shuffledSequence.forEach((item) => {
            const card = createCard(item.emoji, item.text);
            // Add the sequence badge (hidden initially)
            const badge = document.createElement("div");
            badge.className = "sequence-badge";
            card.appendChild(badge);
            
            card.onclick = () => handleSequenceClick(card, item);
            optionsGrid.appendChild(card);
          });
        }

        // Auto-read main instruction
        setTimeout(() => speakText(currentQuestion.instruction), 500);
      }

      function createCard(emoji, text) {
        const card = document.createElement("div");
        card.className = "option-card";
        card.innerHTML = `
          <div class="option-emoji">${emoji}</div>
          <div class="option-text">${text}</div>
        `;
        return card;
      }

      function playStory() {
        if (window.speechSynthesis.speaking) return; // Prevent double clicking
        
        playBtn.classList.add("playing");
        playBtn.innerHTML = '<i class="fas fa-headphones"></i>';
        playerHint.textContent = "Listen carefully...";
        
        // Read the story, and when it finishes, show the activity
        speakText(currentQuestion.story, 0.85, () => {
          playBtn.classList.remove("playing");
          playBtn.innerHTML = '<i class="fas fa-redo"></i>';
          playerHint.textContent = "Listen again";
          
          if (!activityArea.classList.contains("show")) {
            activityArea.classList.add("show");
            // Auto read the question text
            setTimeout(() => {
              speakText(currentQuestion.question);
            }, 500);
          }
        });
      }

      // Handler for basic multiple choice questions
      function handleQuestionClick(cardElement, optionData) {
        if (isAnswered) return;
        speakText(optionData.text); // Auditory feedback

        if (!optionData.isCorrect) {
          cardElement.classList.add("incorrect");
          setTimeout(() => {
             speakText("Listen to the story again, then try to find the answer.");
             feedbackEl.textContent = "Let's try again! 🎧";
             feedbackEl.className = "feedback show incorrect-text";
          }, 800); 
          return;
        }

        // Correct
        isAnswered = true;
        Array.from(optionsGrid.children).forEach(btn => btn.style.pointerEvents = "none");
        cardElement.classList.add("correct");
        
        setTimeout(() => {
          feedbackEl.className = "feedback show correct-text";
          feedbackEl.textContent = "⭐ Great listening!";
          speakText("Great listening! That is correct.");
          setTimeout(() => nextBtn.style.display = "block", 1500);
        }, 800);
      }

      // Handler for sequence logic (1st, 2nd, 3rd)
      function handleSequenceClick(cardElement, itemData) {
        if (isAnswered) return;
        speakText(itemData.text);

        // Mark card as selected and add number badge
        userSequence.push(itemData);
        cardElement.classList.add("selected");
        const badge = cardElement.querySelector(".sequence-badge");
        badge.textContent = userSequence.length;

        // If they selected all items, check the order
        if (userSequence.length === currentQuestion.sequenceOrder.length) {
          checkSequence();
        }
      }

      function checkSequence() {
        let isCorrect = true;
        for (let i = 0; i < currentQuestion.sequenceOrder.length; i++) {
          if (userSequence[i].text !== currentQuestion.sequenceOrder[i].text) {
            isCorrect = false;
            break;
          }
        }

        if (isCorrect) {
          isAnswered = true;
          Array.from(optionsGrid.children).forEach(card => {
             card.classList.remove("selected");
             card.classList.add("correct");
          });
          
          setTimeout(() => {
            feedbackEl.className = "feedback show correct-text";
            feedbackEl.textContent = "⭐ Perfect order!";
            speakText("Perfect order! You got it right.");
            setTimeout(() => nextBtn.style.display = "block", 1500);
          }, 800);
        } else {
          // Dyslexia-friendly error handling: Gentle reset
          setTimeout(() => {
             speakText("Not quite. Let's try putting them in order again.");
             feedbackEl.textContent = "Let's try again! 🧩";
             feedbackEl.className = "feedback show incorrect-text";
             
             optionsGrid.style.animation = "gentle-shake 0.4s ease";
             
             setTimeout(() => {
               optionsGrid.style.animation = "none";
               userSequence = [];
               // Reset cards visually
               Array.from(optionsGrid.children).forEach(card => {
                 card.classList.remove("selected");
                 const badge = card.querySelector(".sequence-badge");
                 if(badge) badge.textContent = "";
                 card.style.pointerEvents = "auto";
               });
             }, 800);
          }, 800);
        }
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Module
          document.querySelector(".question-bar").style.display = "none";
          document.getElementById("playerBox").style.display = "none";
          activityArea.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `You have amazing ears!<br>You finished all the stories! 🎧⭐`;
          speakText(`You have amazing ears! You finished the Listening module.`);
        }
      }

      // Initialize
      loadQuestion();
    </script>
  </body>
</html>
