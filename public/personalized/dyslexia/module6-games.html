<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 6 - Confidence Building</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      /* Dyslexia-Friendly Variables */
      :root {
        --bg-color: #FDFBF7; 
        --text-color: #2D3748; 
        --card-bg: #FFFFFF;
        --accent-color: #4A90E2; 
        --success-color: #48BB78;
        --reward-color: #FFD166; /* Bright yellow for badges */
        --shelf-color: #E2E8F0;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        font-family: 'Lexend', sans-serif; 
        background-color: var(--bg-color); 
        color: var(--text-color);
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        letter-spacing: 0.8px; 
        line-height: 1.8; 
      }
      
      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background-color: var(--accent-color); color: white; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
      .logo { font-size: 28px; font-weight: 800; cursor: pointer; letter-spacing: 1px;}
      .logo span { color: #FFD166; }
      .nav-links { list-style: none; display: flex; gap: 30px; }
      .nav-links a { text-decoration: none; color: white; font-weight: 600; padding: 10px 20px; border-radius: 8px; transition: 0.3s; font-size: 1.1rem; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.2); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: var(--card-bg); border-radius: 24px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05); border: 4px solid #E2E8F0; }

      /* Header */
      .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 3px solid #E2E8F0; padding-bottom: 20px; }
      .header-icon { width: 60px; height: 60px; background: var(--reward-color); border-radius: 16px; color: #2D3748; font-size: 2.5rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(255, 209, 102, 0.5); }
      h2 { color: var(--text-color); font-weight: 800; font-size: 2rem; }

      /* The Trophy Shelf */
      .trophy-shelf { background: #F7FAFC; border: 4px solid var(--shelf-color); border-radius: 20px; padding: 20px; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
      .shelf-title { font-size: 1.4rem; font-weight: 800; color: #718096; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
      .badges-container { display: flex; justify-content: center; gap: 20px; min-height: 80px; width: 100%; border-bottom: 6px solid #CBD5E0; padding-bottom: 10px; }
      
      .badge { font-size: 4rem; animation: tada 1s ease; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
      .badge-placeholder { width: 60px; height: 60px; background: #E2E8F0; border-radius: 50%; opacity: 0.5; }

      /* Instruction Bar */
      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #EBF8FF; padding: 25px 35px; border-radius: 16px; margin-bottom: 30px; border: 3px solid #90CDF4; }
      .question-text { font-size: 1.6rem; font-weight: 600; color: var(--text-color); flex: 1; }
      
      .speaker-icon { width: 65px; height: 65px; background: var(--accent-color); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(74, 144, 226, 0.3); flex-shrink: 0; margin-left: 20px; }
      .speaker-icon:hover { transform: scale(1.1); background: #357ABD; }

      /* Options Grid */
      .options-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; width: 100%; margin-bottom: 20px; }
      
      .option-card { background: #fff; border: 4px solid #E2E8F0; border-radius: 20px; width: 220px; padding: 30px 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.05); user-select: none; }
      .option-card:hover { border-color: var(--accent-color); transform: translateY(-8px); box-shadow: 0 12px 20px rgba(74, 144, 226, 0.2); }
      .option-card:active { transform: translateY(0); }
      
      .option-emoji { font-size: 6rem; margin-bottom: 15px; }
      .option-text { font-size: 1.5rem; font-weight: 800; color: var(--text-color); text-align: center; }

      /* Feedback States (Error Friendly!) */
      .option-card.correct { background: #F0FFF4; border-color: var(--success-color); animation: bounce-up 0.5s ease; pointer-events: none; }
      
      /* No harsh red. Just a soft gray-out and gentle shake */
      .option-card.incorrect { background: #F7FAFC; border-color: #CBD5E0; opacity: 0.6; pointer-events: none; transform: scale(0.95); }

      .feedback { text-align: center; font-size: 1.8rem; font-weight: 800; min-height: 50px; margin-top: 10px; opacity: 0; transition: opacity 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: var(--success-color); }
      .feedback.incorrect-text { color: #718096; /* Neutral slate instead of red */ }

      /* Controls */
      .next-btn { background: var(--reward-color); color: #2D3748; border: none; border-radius: 12px; padding: 15px 40px; font-weight: 800; font-size: 1.5rem; cursor: pointer; display: block; margin: 30px auto 0; transition: all 0.3s ease; display: none; box-shadow: 0 6px 15px rgba(255, 209, 102, 0.4); }
      .next-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 209, 102, 0.5); }

      /* Grand Finale Box */
      .finale-box { display: none; margin-top: 30px; background: #FFFAF0; border: 4px solid var(--reward-color); border-radius: 20px; padding: 50px; text-align: center; font-weight: 800; font-size: 2.5rem; color: #D69E2E; flex-direction: column; align-items: center; gap: 20px; animation: pop-in 1s ease; }
      .finale-icon { font-size: 6rem; animation: tada 2s infinite; }

      /* Animations */
      @keyframes pop-in { 0% { transform: scale(0.9); opacity: 0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
      @keyframes bounce-up { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
      @keyframes tada { 0% { transform: scale(1); } 10%, 20% { transform: scale(0.9) rotate(-3deg); } 30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); } 40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); } 100% { transform: scale(1); } }

      /* Footer */
      .footer { background-color: var(--text-color); color: white; padding: 25px; text-align: center; margin-top: auto; font-size: 1rem; }

      @media(max-width: 600px) {
        .option-card { width: 140px; padding: 20px 10px; }
        .option-emoji { font-size: 4rem; }
        .option-text { font-size: 1.2rem; }
        .badge { font-size: 2.5rem; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index3.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index3.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🎮</div>
          <h2>Module 6: Badge Quest!</h2>
        </div>

        <div class="trophy-shelf" id="trophyShelf">
          <div class="shelf-title">Your Badges</div>
          <div class="badges-container" id="badgesContainer">
            </div>
        </div>

        <div class="question-bar" id="gameUI">
          <div class="question-text" id="questionText">Loading Level...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="options-grid" id="optionsGrid">
          </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
          Next Level 🚀
        </button>

        <div id="finaleBox" class="finale-box">
          <div class="finale-icon">🏆</div>
          <div>You are a Champion!</div>
          <div style="font-size: 1.5rem; color: #4A5568;">You collected all the badges and finished the game!</div>
        </div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // Curriculum Data: Low-stress, highly visual gamified questions
      const questions = [
        {
          instruction: "Level 1: Which animal says 'Moo'?",
          rewardBadge: "🌟",
          options: [
            { text: "Cow", emoji: "🐄", isCorrect: true },
            { text: "Pig", emoji: "🐖", isCorrect: false }
          ]
        },
        {
          instruction: "Level 2: Find the color Blue.",
          rewardBadge: "🚀",
          options: [
            { text: "Red", emoji: "🟥", isCorrect: false },
            { text: "Blue", emoji: "🟦", isCorrect: true }
          ]
        },
        {
          instruction: "Level 3: Which one can you eat?",
          rewardBadge: "👑",
          options: [
            { text: "Apple", emoji: "🍎", isCorrect: true },
            { text: "Shoe", emoji: "👟", isCorrect: false }
          ]
        },
        {
          instruction: "Final Level: Find the happy face!",
          rewardBadge: "💎",
          options: [
            { text: "Sad", emoji: "😢", isCorrect: false },
            { text: "Happy", emoji: "😊", isCorrect: true }
          ]
        }
      ];

      let currentIdx = 0;
      let currentQuestion = null;
      let isAnswered = false;
      let earnedBadges = [];

      // DOM Elements
      const badgesContainer = document.getElementById("badgesContainer");
      const questionTextEl = document.getElementById("questionText");
      const optionsGrid = document.getElementById("optionsGrid");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const gameUI = document.getElementById("gameUI");
      const finaleBox = document.getElementById("finaleBox");

      // Text to Speech Function (Enthusiastic and clear)
      function speakText(text, rate = 0.9) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = rate; 
        window.speechSynthesis.speak(utterance);
      }

      function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
      }

      // Initialize the empty shelf placeholders based on number of questions
      function initShelf() {
        badgesContainer.innerHTML = "";
        for(let i=0; i<questions.length; i++) {
          const placeholder = document.createElement("div");
          placeholder.className = "badge-placeholder";
          placeholder.id = `badge-slot-${i}`;
          badgesContainer.appendChild(placeholder);
        }
      }

      function loadQuestion() {
        currentQuestion = questions[currentIdx];
        isAnswered = false;
        
        // Reset UI
        questionTextEl.textContent = currentQuestion.instruction;
        optionsGrid.innerHTML = "";
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";

        // Render Options
        const shuffledOptions = shuffleArray(currentQuestion.options);
        shuffledOptions.forEach(option => {
          const card = document.createElement("div");
          card.className = "option-card";
          
          card.innerHTML = `
            <div class="option-emoji">${option.emoji}</div>
            <div class="option-text">${option.text}</div>
          `;
          
          card.onclick = () => handleAnswerClick(card, option);
          optionsGrid.appendChild(card);
        });

        // Auto-read instruction
        setTimeout(() => speakText(currentQuestion.instruction), 500);
      }

      function handleAnswerClick(cardElement, optionData) {
        if (isAnswered) return;

        // Speak the option they clicked
        speakText(optionData.text); 

        if (!optionData.isCorrect) {
          // Error-friendly: No red X. Just gray it out gently and encourage.
          cardElement.classList.add("incorrect");
          
          setTimeout(() => {
             speakText("Let's try the other one!");
             feedbackEl.textContent = "Let's try the other one! 💡";
             feedbackEl.className = "feedback show incorrect-text";
          }, 800); 
          return;
        }

        // Correct Selection
        isAnswered = true;
        Array.from(optionsGrid.children).forEach(btn => btn.style.pointerEvents = "none");
        cardElement.classList.add("correct");
        
        // Reward Sequence
        setTimeout(() => {
          feedbackEl.className = "feedback show correct-text";
          feedbackEl.innerHTML = `⭐ You earned the <strong>${currentQuestion.rewardBadge}</strong> Badge!`;
          speakText("Amazing! You earned a new badge.");
          
          awardBadge(currentQuestion.rewardBadge);

          setTimeout(() => nextBtn.style.display = "block", 2000);
        }, 800);
      }

      function awardBadge(badgeEmoji) {
        earnedBadges.push(badgeEmoji);
        
        // Replace the placeholder with the actual badge
        const slot = document.getElementById(`badge-slot-${currentIdx}`);
        slot.className = "badge";
        slot.textContent = badgeEmoji;
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Grand Finale
          gameUI.style.display = "none";
          optionsGrid.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          finaleBox.style.display = "flex";
          speakText("Wow! You are a champion. You collected all the badges and finished the game!");
        }
      }

      // Initialize
      initShelf();
      loadQuestion();
    </script>
  </body>
</html>
