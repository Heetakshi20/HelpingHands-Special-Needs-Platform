<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 3 - Writing Skills</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      /* Dyslexia-Friendly Variables */
      :root {
        --bg-color: #FDFBF7; 
        --text-color: #2D3748; 
        --card-bg: #FFFFFF;
        --accent-color: #4A90E2; 
        --success-color: #48BB78;
        --error-color: #ED8936; /* Warm orange instead of harsh red */
        --tile-bg: #EDF2F7;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body { 
        font-family: 'Lexend', sans-serif; 
        background-color: var(--bg-color); 
        color: var(--text-color);
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        letter-spacing: 0.8px; 
        line-height: 1.8; 
      }
      
      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background-color: var(--accent-color); color: white; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
      .logo { font-size: 28px; font-weight: 800; cursor: pointer; letter-spacing: 1px;}
      .logo span { color: #FFD166; }
      .nav-links { list-style: none; display: flex; gap: 30px; }
      .nav-links a { text-decoration: none; color: white; font-weight: 600; padding: 10px 20px; border-radius: 8px; transition: 0.3s; font-size: 1.1rem; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.2); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: var(--card-bg); border-radius: 24px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05); border: 4px solid #E2E8F0; }

      /* Header */
      .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 3px solid #E2E8F0; padding-bottom: 20px; }
      .header-icon { width: 60px; height: 60px; background: var(--accent-color); border-radius: 16px; color: white; font-size: 2rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: var(--text-color); font-weight: 800; font-size: 2rem; }

      /* Instruction Bar */
      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #EBF8FF; padding: 25px 35px; border-radius: 16px; margin-bottom: 30px; border: 3px solid #90CDF4; }
      .question-text { font-size: 1.6rem; font-weight: 600; color: var(--text-color); }
      
      .speaker-icon { width: 65px; height: 65px; background: var(--accent-color); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(74, 144, 226, 0.3); flex-shrink: 0; margin-left: 20px; }
      .speaker-icon:hover { transform: scale(1.1); background: #357ABD; }

      /* Activity Area */
      .activity-box { background: #FAFAFA; border: 3px dashed #CBD5E0; border-radius: 20px; padding: 30px; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
      
      .visual-prompt { font-size: 5rem; animation: pop-in 0.5s ease; }

      /* Drop Zone (Where they build the word/sentence) */
      .build-zone { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; min-height: 80px; padding: 20px; width: 100%; border-bottom: 4px solid #E2E8F0; }
      
      /* The blocks they click */
      .options-zone { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; width: 100%; }

      /* Tiles */
      .tile { background: var(--tile-bg); border: 4px solid #CBD5E0; border-radius: 16px; padding: 15px 25px; font-size: 2rem; font-weight: 800; color: var(--text-color); cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.05); user-select: none; display: flex; justify-content: center; align-items: center; text-transform: lowercase; }
      .tile:hover { border-color: var(--accent-color); background: #EBF8FF; transform: translateY(-4px); }
      .tile:active { transform: translateY(0); }
      
      /* Sentence tiles are wider and lowercase/uppercase is preserved */
      .tile.word-tile { font-size: 1.6rem; padding: 15px 30px; text-transform: none; }

      /* Feedback & Controls */
      .controls { display: flex; justify-content: center; gap: 20px; width: 100%; }
      .action-btn { background: #CBD5E0; color: #4A5568; border: none; border-radius: 12px; padding: 15px 30px; font-weight: 800; font-size: 1.2rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 10px; }
      .action-btn:hover { background: #A0AEC0; color: white; }
      
      .check-btn { background: var(--success-color); color: white; box-shadow: 0 6px 15px rgba(72, 187, 120, 0.3); }
      .check-btn:hover { background: #38A169; box-shadow: 0 8px 20px rgba(72, 187, 120, 0.4); transform: translateY(-3px); color: white; }

      .feedback { text-align: center; font-size: 1.5rem; font-weight: 800; min-height: 40px; margin-top: 20px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: var(--success-color); }
      .feedback.incorrect-text { color: var(--error-color); }

      .next-btn { background: var(--accent-color); color: white; border: none; border-radius: 12px; padding: 15px 40px; font-weight: 800; font-size: 1.4rem; cursor: pointer; display: block; margin: 20px auto 0; transition: all 0.3s ease; display: none; }
      .next-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3); }

      .score-box { display: none; margin-top: 30px; background: #F0FFF4; border: 4px solid #9AE6B4; border-radius: 20px; padding: 40px; text-align: center; font-weight: 800; font-size: 2.2rem; color: var(--success-color); }

      /* Animations */
      @keyframes pop-in { 0% { transform: scale(0.8); opacity: 0;} 60% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1;} }
      @keyframes gentle-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

      /* Footer */
      .footer { background-color: var(--text-color); color: white; padding: 25px; text-align: center; margin-top: auto; font-size: 1rem; }

      @media(max-width: 600px) {
        .tile { font-size: 1.5rem; padding: 10px 15px; }
        .tile.word-tile { font-size: 1.2rem; }
        .build-zone { min-height: 60px; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index3.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index3.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">✍️</div>
          <h2>Module 3: Spelling & Writing</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading...</div>
          <div class="speaker-icon" onclick="speakQuestion()" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="activity-box">
          <div class="visual-prompt" id="visualPrompt">🍎</div>
          
          <div class="build-zone" id="buildZone">
             </div>

          <div class="options-zone" id="optionsZone">
             </div>
        </div>

        <div class="controls" id="controls">
          <button class="action-btn" onclick="clearBoard()">
            <i class="fas fa-undo"></i> Start Over
          </button>
          <button class="action-btn check-btn" onclick="checkAnswer()">
            <i class="fas fa-check"></i> Check Work
          </button>
        </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
          Next Activity ➡️
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // Curriculum Data: Mix of spelling single words and building short sentences
      const questions = [
        {
          type: "spelling",
          instruction: "Listen to the word. Can you spell it?",
          target: "cat",
          audioHint: "Cat. C - A - T. Cat.",
          visual: "🐱",
          options: ["a", "t", "c", "p"] // Includes one distractor
        },
        {
          type: "spelling",
          instruction: "Let's spell another word!",
          target: "sun",
          audioHint: "Sun. S - U - N. Sun.",
          visual: "☀️",
          options: ["u", "n", "m", "s"] 
        },
        {
          type: "sentence",
          instruction: "Now let's build a sentence! Tap the words in order.",
          target: "The dog runs",
          audioHint: "The dog runs.",
          visual: "🐕",
          options: ["dog", "runs", "The"] 
        },
        {
          type: "sentence",
          instruction: "Build one more sentence. You can do it!",
          target: "I see a bird",
          audioHint: "I see a bird.",
          visual: "🐦",
          options: ["bird", "I", "a", "see"] 
        }
      ];

      let currentIdx = 0;
      let currentQuestion = null;
      let isAnswered = false;

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const visualPromptEl = document.getElementById("visualPrompt");
      const buildZone = document.getElementById("buildZone");
      const optionsZone = document.getElementById("optionsZone");
      const feedbackEl = document.getElementById("feedback");
      const controlsEl = document.getElementById("controls");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function (Clear, deliberate pacing)
      function speakText(text, rate = 0.8) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = rate; 
        window.speechSynthesis.speak(utterance);
      }

      function speakQuestion() {
        speakText(currentQuestion.instruction);
        setTimeout(() => {
          speakText(currentQuestion.audioHint, 0.75); // Read hint slightly slower
        }, 1500);
      }

      function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
      }

      function loadQuestion() {
        currentQuestion = questions[currentIdx];
        isAnswered = false;
        
        // Reset UI
        questionTextEl.textContent = currentQuestion.instruction;
        visualPromptEl.textContent = currentQuestion.visual;
        buildZone.innerHTML = "";
        optionsZone.innerHTML = "";
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        controlsEl.style.display = "flex";
        nextBtn.style.display = "none";

        // Determine Tile Class based on spelling vs sentence
        const tileClass = currentQuestion.type === "sentence" ? "tile word-tile" : "tile";

        // Generate Tiles
        const shuffledOptions = shuffleArray(currentQuestion.options);
        shuffledOptions.forEach((item, id) => {
          const tile = document.createElement("div");
          tile.className = tileClass;
          tile.textContent = item;
          tile.dataset.value = item;
          tile.dataset.id = id; // Keep track for unique moving
          tile.onclick = () => moveTile(tile);
          optionsZone.appendChild(tile);
        });

        // Auto-read instruction and hint
        setTimeout(() => speakQuestion(), 500);
      }

      // Handle clicking a tile (moves it between the options zone and the build zone)
      function moveTile(tile) {
        if (isAnswered) return;

        // Speak the tile content when touched (Multisensory feedback)
        if (currentQuestion.type === "spelling") {
          // If it's a single letter, read the letter name
          speakText(tile.textContent, 0.9);
        } else {
          // If it's a word, read the word
          speakText(tile.textContent, 0.9);
        }

        // Move logic
        if (tile.parentElement.id === "optionsZone") {
          buildZone.appendChild(tile);
        } else {
          optionsZone.appendChild(tile);
        }
      }

      // Sends all tiles back to the options zone
      function clearBoard() {
        if (isAnswered) return;
        Array.from(buildZone.children).forEach(tile => {
          optionsZone.appendChild(tile);
        });
        feedbackEl.classList.remove("show");
      }

      // Validates the user's built string
      function checkAnswer() {
        if (isAnswered) return;

        // Construct what the user built
        const tiles = Array.from(buildZone.children);
        let userString = "";
        
        if (currentQuestion.type === "spelling") {
          // Join letters with no spaces
          userString = tiles.map(t => t.dataset.value).join("");
        } else {
          // Join words with spaces
          userString = tiles.map(t => t.dataset.value).join(" ");
        }

        // Compare
        if (userString === currentQuestion.target) {
          handleCorrect();
        } else {
          handleIncorrect();
        }
      }

      function handleCorrect() {
        isAnswered = true;
        
        // Read the final successful word/sentence
        speakText("Great job! " + currentQuestion.target);

        // Visual feedback
        feedbackEl.textContent = "⭐ Excellent work!";
        feedbackEl.className = "feedback show correct-text";
        controlsEl.style.display = "none";

        // Green styling on the correct tiles
        Array.from(buildZone.children).forEach(tile => {
          tile.style.backgroundColor = "#F0FFF4";
          tile.style.borderColor = "#48BB78";
          tile.style.color = "#2F855A";
          tile.style.pointerEvents = "none";
        });

        setTimeout(() => {
          nextBtn.style.display = "block";
        }, 1500);
      }

      function handleIncorrect() {
        // Dyslexia-friendly error handling: Gentle shake, encouraging text, reset tiles
        speakText("Not quite. Let's try again!");
        
        feedbackEl.textContent = "Let's try again! 🧩";
        feedbackEl.className = "feedback show incorrect-text";
        
        buildZone.style.animation = "gentle-shake 0.4s ease";
        
        setTimeout(() => {
          buildZone.style.animation = "none";
          clearBoard();
        }, 800);
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Module
          document.querySelector(".question-bar").style.display = "none";
          document.querySelector(".activity-box").style.display = "none";
          controlsEl.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `You are an amazing writer!<br>You built everything perfectly! ✍️🌟`;
          speakText(`You are an amazing writer! You finished the Writing module.`);
        }
      }

      // Initialize
      loadQuestion();
    </script>
  </body>
</html>
