<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 4 - Daily Life Skills</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
      /* Base variables and styles */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Times New Roman', Times, serif; background: linear-gradient(135deg, #87ceeb 0%, #e0f6ff 100%); min-height: 100vh; display: flex; flex-direction: column; }

      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #0D5791; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .logo { font-size: 26px; font-weight: bold; cursor: pointer;}
      .logo span { color: #7CE04A; }
      .nav-links { list-style: none; display: flex; gap: 20px; flex: 1; justify-content: center; }
      .nav-links a { text-decoration: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 5px; transition: 0.3s; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.2); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 1000px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12); }

      /* Header & TTS */
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #17a2b8; padding-bottom: 15px; }
      .header-icon { width: 55px; height: 55px; background: #17a2b8; border-radius: 50%; color: white; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: #17a2b8; font-weight: 700; font-size: 1.8rem; }

      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #f0fbff; padding: 20px 30px; border-radius: 15px; margin-bottom: 30px; border: 2px solid #87ceeb; }
      .question-text { font-size: 1.5rem; font-weight: 600; color: #333; }
      
      .speaker-icon { width: 50px; height: 50px; background: #87ceeb; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(135,206,235,0.4); flex-shrink: 0; }
      .speaker-icon:hover { background: #17a2b8; transform: scale(1.1); }

      /* First / Next / Last Board */
      .routine-board { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 40px; padding: 20px; background: #f8f9fa; border-radius: 15px; border: 2px dashed #ced4da; flex-wrap: wrap; }
      
      .slot-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .slot-label { font-weight: 700; font-size: 1.2rem; color: #0D5791; text-transform: uppercase; letter-spacing: 1px; }
      
      .slot { width: 140px; height: 140px; background: white; border: 3px dashed #adb5bd; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.1rem; font-weight: 600; color: #6c757d; transition: all 0.3s; text-align: center; padding: 10px; }
      .slot.filled { border-style: solid; border-color: #28a745; background: #e8f5e9; color: #333; animation: pop-in 0.3s ease-out; box-shadow: 0 4px 8px rgba(40, 167, 69, 0.2); }
      
      .slot-emoji { font-size: 3rem; margin-bottom: 5px; }
      .arrow { font-size: 2.5rem; color: #adb5bd; margin-top: 30px; }

      /* Options Grid */
      .options-title { text-align: center; font-size: 1.2rem; font-weight: 600; color: #6c757d; margin-bottom: 15px; }
      .options-grid { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }

      .option-card { background: #fff; border: 3px solid #e0e0e0; border-radius: 15px; padding: 15px; width: 130px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
      .option-card:hover { border-color: #17a2b8; transform: translateY(-4px); box-shadow: 0 8px 15px rgba(23,162,184,0.15); }
      .option-card:active { transform: translateY(0); }
      .option-card.used { opacity: 0.3; pointer-events: none; border-color: #e0e0e0; }
      
      .option-emoji { font-size: 2.5rem; margin-bottom: 8px; }
      .option-text { font-weight: 600; font-size: 1rem; color: #333; }

      /* Controls & Feedback */
      .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
      
      .btn { border: none; border-radius: 12px; padding: 12px 30px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
      .clear-btn { background: #ffc107; color: #000; }
      .clear-btn:hover { background: #e0a800; transform: translateY(-2px); }
      .next-btn { background: linear-gradient(135deg, #28a745, #20c997); color: white; display: none; }
      .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(40, 167, 69, 0.3); }

      .feedback { text-align: center; font-size: 1.4rem; font-weight: 700; min-height: 35px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: #28a745; }
      .feedback.incorrect-text { color: #dc3545; }

      .score-box { display: none; margin-top: 30px; background: #f0f9ff; border: 3px solid #87ceeb; border-radius: 15px; padding: 30px; text-align: center; font-weight: 700; font-size: 2rem; color: #0D5791; animation: pop-in 0.5s ease; }

      @keyframes pop-in {
        0% { transform: scale(0.8); opacity: 0; }
        60% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }

      /* Footer */
      .footer { background-color: #0a4a82; color: white; padding: 20px; text-align: center; margin-top: auto; }

      @media(max-width: 768px) {
        .routine-board { flex-direction: column; gap: 5px; }
        .arrow { transform: rotate(90deg); margin: 0; font-size: 2rem; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🏠</div>
          <h2>Module 4: Daily Life Skills</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading routine...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="routine-board" id="routineBoard">
          <div class="slot-container">
            <div class="slot-label">First</div>
            <div class="slot" id="slot-0"></div>
          </div>
          
          <div class="arrow">➡️</div>
          
          <div class="slot-container">
            <div class="slot-label">Next</div>
            <div class="slot" id="slot-1"></div>
          </div>

          <div class="arrow">➡️</div>

          <div class="slot-container">
            <div class="slot-label">Last</div>
            <div class="slot" id="slot-2"></div>
          </div>
        </div>

        <div class="options-title" id="optionsTitle">Tap the pictures in the correct order:</div>
        <div class="options-grid" id="optionsGrid">
          </div>

        <div class="controls" id="controlsSection">
          <button class="btn clear-btn" onclick="clearSlots()"><i class="fas fa-undo"></i> Start Over</button>
          <button class="btn next-btn" id="nextBtn" onclick="nextQuestion()">Next Routine <i class="fas fa-arrow-right"></i></button>
        </div>

        <div id="feedback" class="feedback"></div>
        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // Curriculum Data for Daily Routines
      const questions = [
        {
          instruction: "It's time to wash our hands. What do we do?",
          correctOrder: [
            { text: "Turn on water", emoji: "🚰" },
            { text: "Use soap", emoji: "🧼" },
            { text: "Dry hands", emoji: "🖐️" }
          ]
        },
        {
          instruction: "Let's get dressed for the day!",
          correctOrder: [
            { text: "Put on shirt", emoji: "👕" },
            { text: "Put on pants", emoji: "👖" },
            { text: "Put on shoes", emoji: "👟" }
          ]
        },
        {
          instruction: "It's time to eat dinner.",
          correctOrder: [
            { text: "Wash hands", emoji: "🧼" },
            { text: "Eat food", emoji: "🍽️" },
            { text: "Wipe mouth", emoji: "🧻" }
          ]
        },
        {
          instruction: "It's night time. Let's get ready for bed.",
          correctOrder: [
            { text: "Brush teeth", emoji: "🪥" },
            { text: "Pajamas on", emoji: "👚" },
            { text: "Sleep in bed", emoji: "🛏️" }
          ]
        }
      ];

      let currentIdx = 0;
      let score = 0;
      let currentQuestion = null;
      let userSelection = [];

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const optionsGridEl = document.getElementById("optionsGrid");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function
      function speakText(text) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-IN";
        utterance.rate = 0.9; 
        window.speechSynthesis.speak(utterance);
      }

      // Helper to shuffle the array of options so the answer isn't just left-to-right
      function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
      }

      function loadQuestion() {
        currentQuestion = questions[currentIdx];
        questionTextEl.textContent = currentQuestion.instruction;
        
        clearSlots();
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";
        optionsGridEl.style.pointerEvents = "auto";

        // Shuffle the options before displaying
        const shuffledOptions = shuffleArray(currentQuestion.correctOrder);

        // Generate the clickable options
        optionsGridEl.innerHTML = "";
        shuffledOptions.forEach((item, index) => {
          const btn = document.createElement("div");
          btn.className = "option-card";
          btn.dataset.text = item.text;
          btn.dataset.emoji = item.emoji;
          btn.innerHTML = `
            <div class="option-emoji">${item.emoji}</div>
            <div class="option-text">${item.text}</div>
          `;
          btn.onclick = () => selectCard(btn, item);
          optionsGridEl.appendChild(btn);
        });

        setTimeout(() => speakText(currentQuestion.instruction), 500);
      }

      function selectCard(btnElement, item) {
        // Prevent clicking if we already filled 3 slots
        if (userSelection.length >= 3) return;

        speakText(item.text);

        // Add to our tracked array
        userSelection.push(item);
        
        // Find the next empty slot (0, 1, or 2)
        const currentSlotIndex = userSelection.length - 1;
        const targetSlot = document.getElementById(`slot-${currentSlotIndex}`);
        
        // Fill the slot visually
        targetSlot.innerHTML = `
          <div class="slot-emoji">${item.emoji}</div>
          <div>${item.text}</div>
        `;
        targetSlot.classList.add("filled");

        // Gray out the option button so it can't be clicked again
        btnElement.classList.add("used");

        // Check if all 3 slots are filled
        if (userSelection.length === 3) {
          checkRoutine();
        }
      }

      function clearSlots() {
        userSelection = [];
        
        // Clear visually
        for (let i = 0; i < 3; i++) {
          const slot = document.getElementById(`slot-${i}`);
          slot.innerHTML = "";
          slot.classList.remove("filled");
        }

        // Reactivate all option buttons
        Array.from(optionsGridEl.children).forEach(btn => {
          btn.classList.remove("used");
        });

        feedbackEl.classList.remove("show", "correct-text", "incorrect-text");
        nextBtn.style.display = "none";
        optionsGridEl.style.pointerEvents = "auto";
      }

      function checkRoutine() {
        optionsGridEl.style.pointerEvents = "none"; // Disable clicking

        let isCorrect = true;
        for (let i = 0; i < 3; i++) {
          if (userSelection[i].text !== currentQuestion.correctOrder[i].text) {
            isCorrect = false;
            break;
          }
        }

        setTimeout(() => {
          if (isCorrect) {
            score++;
            feedbackEl.textContent = "✓ Perfect! That is the right order.";
            feedbackEl.className = "feedback show correct-text";
            speakText("Perfect! That is the right order.");
            nextBtn.style.display = "inline-flex";
          } else {
            feedbackEl.textContent = "✗ Not quite. Tap 'Start Over' to try again.";
            feedbackEl.className = "feedback show incorrect-text";
            speakText("Not quite. Let's start over and try again.");
          }
        }, 1000); // Slight delay before checking so they can process the visuals
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Quiz
          questionTextEl.textContent = "Module Completed! 🎉";
          document.querySelector(".speaker-icon").style.display = "none";
          document.getElementById("routineBoard").style.display = "none";
          document.getElementById("optionsTitle").style.display = "none";
          optionsGridEl.style.display = "none";
          document.getElementById("controlsSection").style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `Great job with your routines!<br>You built ${score} sequences correctly! 🌟`;
          speakText(`Great job with your routines! You completed the Daily Life Skills module.`);
        }
      }

      // Start the module
      loadQuestion();
    </script>
  </body>
</html>
