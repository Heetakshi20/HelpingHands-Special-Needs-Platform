<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 1 - Communication</title>
    <link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
      /* Base variables and styles */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Times New Roman', Times, serif; background: linear-gradient(135deg, #87ceeb 0%, #e0f6ff 100%); min-height: 100vh; display: flex; flex-direction: column; }

      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #0D5791; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .logo { font-size: 26px; font-weight: bold; cursor: pointer;}
      .logo span { color: #7CE04A; }
      .nav-links { list-style: none; display: flex; gap: 20px; flex: 1; justify-content: center; }
      .nav-links a { text-decoration: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 5px; transition: 0.3s; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.2); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12); }

      /* Header & TTS */
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #17a2b8; padding-bottom: 15px; }
      .header-icon { width: 55px; height: 55px; background: #17a2b8; border-radius: 50%; color: white; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: #17a2b8; font-weight: 700; font-size: 1.8rem; }

      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #f0fbff; padding: 20px 30px; border-radius: 15px; margin-bottom: 30px; border: 2px solid #87ceeb; }
      .question-text { font-size: 1.5rem; font-weight: 600; color: #333; }
      
      .speaker-icon { width: 50px; height: 50px; background: #87ceeb; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(135,206,235,0.4); flex-shrink: 0; }
      .speaker-icon:hover { background: #17a2b8; transform: scale(1.1); }

      /* Sentence Builder Area */
      .sentence-builder { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; padding: 20px; background: #f8f9fa; border-radius: 15px; border: 2px dashed #ced4da; }
      
      .slot { width: 160px; height: 160px; background: white; border: 3px dashed #adb5bd; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: 600; color: #6c757d; transition: all 0.3s; text-align: center; }
      .slot.filled { border-style: solid; border-color: #28a745; background: #e8f5e9; color: #333; animation: pop-in 0.3s ease-out; }
      .slot-icon { font-size: 3.5rem; margin-bottom: 10px; }

      /* PECS Board (Options) */
      .pecs-board { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
      .category-title { font-size: 1.2rem; color: #0D5791; font-weight: 700; margin-bottom: 10px; text-align: center; }
      .pecs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

      .pecs-card { background: #fff; border: 3px solid #e0e0e0; border-radius: 15px; padding: 15px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
      .pecs-card:hover { border-color: #17a2b8; transform: translateY(-4px); box-shadow: 0 8px 15px rgba(23,162,184,0.15); }
      .pecs-card:active { transform: translateY(0); }
      .pecs-icon { font-size: 2.5rem; margin-bottom: 5px; }
      .pecs-text { font-weight: 600; font-size: 1.1rem; color: #333; }

      /* Controls & Feedback */
      .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
      
      .btn { border: none; border-radius: 12px; padding: 12px 30px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
      .clear-btn { background: #ffc107; color: #000; }
      .clear-btn:hover { background: #e0a800; transform: translateY(-2px); }
      .next-btn { background: linear-gradient(135deg, #28a745, #20c997); color: white; display: none; }
      .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(40, 167, 69, 0.3); }

      .feedback { text-align: center; font-size: 1.4rem; font-weight: 700; min-height: 35px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: #28a745; }
      .feedback.incorrect-text { color: #dc3545; }

      .score-box { display: none; margin-top: 30px; background: #f0f9ff; border: 3px solid #87ceeb; border-radius: 15px; padding: 30px; text-align: center; font-weight: 700; font-size: 2rem; color: #0D5791; animation: pulse-green 1s ease; }

      @keyframes pop-in {
        0% { transform: scale(0.8); opacity: 0; }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes pulse-green {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* Footer */
      .footer { background-color: #0a4a82; color: white; padding: 20px; text-align: center; margin-top: auto; }

      @media(max-width: 768px) {
        .pecs-board { grid-template-columns: 1fr; }
        .slot { width: 130px; height: 130px; font-size: 1rem; }
        .slot-icon { font-size: 2.5rem; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🗣️</div>
          <h2>Module 1: Picture Communication</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading scenario...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.scenario)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="sentence-builder">
          <div class="slot" id="actionSlot">
            <span>Action</span>
          </div>
          <div class="slot" id="objectSlot">
            <span>Object</span>
          </div>
        </div>

        <div class="pecs-board" id="pecsBoard">
          <div>
            <div class="category-title">1. Start your sentence</div>
            <div class="pecs-grid">
              <button class="pecs-card" onclick="selectCard('action', 'I want', '🤲')">
                <span class="pecs-icon">🤲</span>
                <span class="pecs-text">I want</span>
              </button>
              <button class="pecs-card" onclick="selectCard('action', 'I see', '👀')">
                <span class="pecs-icon">👀</span>
                <span class="pecs-text">I see</span>
              </button>
            </div>
          </div>
          <div>
            <div class="category-title">2. Choose the object</div>
            <div class="pecs-grid">
              <button class="pecs-card" onclick="selectCard('object', 'Water', '💧')">
                <span class="pecs-icon">💧</span>
                <span class="pecs-text">Water</span>
              </button>
              <button class="pecs-card" onclick="selectCard('object', 'Apple', '🍎')">
                <span class="pecs-icon">🍎</span>
                <span class="pecs-text">Apple</span>
              </button>
              <button class="pecs-card" onclick="selectCard('object', 'Dog', '🐕')">
                <span class="pecs-icon">🐕</span>
                <span class="pecs-text">Dog</span>
              </button>
              <button class="pecs-card" onclick="selectCard('object', 'Toy', '🧸')">
                <span class="pecs-icon">🧸</span>
                <span class="pecs-text">Toy</span>
              </button>
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="btn clear-btn" onclick="clearSlots()"><i class="fas fa-undo"></i> Start Over</button>
          <button class="btn next-btn" id="nextBtn" onclick="nextQuestion()">Next Activity <i class="fas fa-arrow-right"></i></button>
        </div>

        <div id="feedback" class="feedback"></div>
        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // The Curriculum Data for Sentence Building
      const questions = [
        {
          scenario: "You are thirsty. Ask for water.",
          targetAction: "I want",
          targetObject: "Water"
        },
        {
          scenario: "Look out the window! Tell me what you see.",
          targetAction: "I see",
          targetObject: "Dog"
        },
        {
          scenario: "You are hungry for a snack. Ask for an apple.",
          targetAction: "I want",
          targetObject: "Apple"
        },
        {
          scenario: "It is playtime! What do you want?",
          targetAction: "I want",
          targetObject: "Toy"
        }
      ];

      let currentIdx = 0;
      let score = 0;
      let currentQuestion = null;
      
      // State for the slots
      let selectedAction = null;
      let selectedObject = null;

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const actionSlotEl = document.getElementById("actionSlot");
      const objectSlotEl = document.getElementById("objectSlot");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");
      const pecsBoard = document.getElementById("pecsBoard");

      // Text to Speech Function
      function speakText(text) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-IN";
        utterance.rate = 0.9; 
        window.speechSynthesis.speak(utterance);
      }

      function loadQuestion() {
        currentQuestion = questions[currentIdx];
        questionTextEl.textContent = currentQuestion.scenario;
        
        clearSlots();
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";
        pecsBoard.style.opacity = "1";
        pecsBoard.style.pointerEvents = "auto";

        setTimeout(() => speakText(currentQuestion.scenario), 500);
      }

      function selectCard(type, text, icon) {
        // Speak the individual word when clicked
        speakText(text);

        if (type === 'action') {
          selectedAction = text;
          actionSlotEl.innerHTML = `<div class="slot-icon">${icon}</div><div>${text}</div>`;
          actionSlotEl.classList.add('filled');
        } else if (type === 'object') {
          selectedObject = text;
          objectSlotEl.innerHTML = `<div class="slot-icon">${icon}</div><div>${text}</div>`;
          objectSlotEl.classList.add('filled');
        }

        // Check if both slots are filled
        if (selectedAction && selectedObject) {
          checkSentence();
        }
      }

      function clearSlots() {
        selectedAction = null;
        selectedObject = null;
        
        actionSlotEl.innerHTML = `<span>Action</span>`;
        actionSlotEl.classList.remove('filled');
        
        objectSlotEl.innerHTML = `<span>Object</span>`;
        objectSlotEl.classList.remove('filled');
        
        feedbackEl.classList.remove("show", "correct-text", "incorrect-text");
      }

      function checkSentence() {
        // Read the full built sentence
        const fullSentence = `${selectedAction} ${selectedObject}`;
        
        setTimeout(() => {
          speakText(fullSentence);
        }, 800); // Wait a moment after they click the last card

        // Check if it matches the target
        if (selectedAction === currentQuestion.targetAction && selectedObject === currentQuestion.targetObject) {
          setTimeout(() => {
            score++;
            feedbackEl.textContent = `✓ "${fullSentence}!" Great job!`;
            feedbackEl.className = "feedback show correct-text";
            speakText("Great job!");
            
            nextBtn.style.display = "block";
            pecsBoard.style.pointerEvents = "none"; // Disable clicking more cards
            pecsBoard.style.opacity = "0.5";
          }, 2000); // Wait for the sentence to be spoken before giving feedback
        } else {
          setTimeout(() => {
            feedbackEl.textContent = "✗ Not quite. Try again!";
            feedbackEl.className = "feedback show incorrect-text";
            speakText("Let's try again.");
          }, 2000);
        }
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Quiz
          questionTextEl.textContent = "Module Completed! 🎉";
          document.querySelector(".speaker-icon").style.display = "none";
          document.querySelector(".sentence-builder").style.display = "none";
          pecsBoard.style.display = "none";
          document.querySelector(".controls").style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `Awesome work!<br>You built ${score} sentences correctly! 🌟`;
          speakText(`Awesome work! You completed the communication module.`);
        }
      }

      // Start the module
      loadQuestion();
    </script>
  </body>
</html>
