<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 3 - Cognitive Skills</title>
    <link rel="shortcut icon" href="img/logo1.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
      /* Base variables and styles */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Times New Roman', Times, serif; background: linear-gradient(135deg, #87ceeb 0%, #e0f6ff 100%); min-height: 100vh; display: flex; flex-direction: column; }

      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #0D5791; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .logo { font-size: 26px; font-weight: bold; cursor: pointer;}
      .logo span { color: #7CE04A; }
      .nav-links { list-style: none; display: flex; gap: 20px; flex: 1; justify-content: center; }
      .nav-links a { text-decoration: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 5px; transition: 0.3s; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.2); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12); }

      /* Header & TTS */
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #17a2b8; padding-bottom: 15px; }
      .header-icon { width: 55px; height: 55px; background: #17a2b8; border-radius: 50%; color: white; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: #17a2b8; font-weight: 700; font-size: 1.8rem; }

      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #f0fbff; padding: 20px 30px; border-radius: 15px; margin-bottom: 40px; border: 2px solid #87ceeb; }
      .question-text { font-size: 1.5rem; font-weight: 600; color: #333; }
      
      .speaker-icon { width: 50px; height: 50px; background: #87ceeb; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(135,206,235,0.4); flex-shrink: 0; }
      .speaker-icon:hover { background: #17a2b8; transform: scale(1.1); }

      /* Puzzle Sequence Area */
      .puzzle-board { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
      
      .sequence-item { width: 100px; height: 100px; background: #f8f9fa; border: 3px solid #e0e0e0; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 4rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: all 0.3s ease; }
      .sequence-item.arrow { background: transparent; border: none; box-shadow: none; font-size: 3rem; color: #adb5bd; }
      
      .slot-empty { background: #fff; border: 4px dashed #adb5bd; color: #adb5bd; font-size: 3rem; font-weight: bold; }
      .slot-filled { border-style: solid; border-color: #28a745; background: #e8f5e9; animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

      /* Options Grid */
      .options-title { text-align: center; font-size: 1.2rem; font-weight: 600; color: #6c757d; margin-bottom: 15px; }
      .options-grid { display: flex; justify-content: center; gap: 25px; margin-bottom: 30px; flex-wrap: wrap; }

      .option-btn { background: #fff; border: 3px solid #e0e0e0; border-radius: 20px; width: 120px; height: 120px; font-size: 4rem; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
      .option-btn:hover { border-color: #17a2b8; transform: translateY(-6px); box-shadow: 0 12px 20px rgba(23,162,184,0.15); }
      .option-btn.correct { background: #d4edda; border-color: #28a745; animation: pulse-green 0.5s ease; }
      .option-btn.incorrect { background: #f8d7da; border-color: #dc3545; opacity: 0.6; animation: shake-red 0.4s ease; }

      /* Controls & Feedback */
      .feedback { text-align: center; font-size: 1.4rem; font-weight: 700; min-height: 40px; margin-bottom: 20px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: #28a745; }
      .feedback.incorrect-text { color: #dc3545; }

      .next-btn { background: linear-gradient(135deg, #28a745, #20c997); color: white; border: none; border-radius: 12px; padding: 15px 50px; font-weight: 700; font-size: 1.3rem; cursor: pointer; display: block; margin: 0 auto; transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(40, 167, 69, 0.3); }
      .next-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4); }
      .next-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; display: none; }

      .score-box { display: none; margin-top: 30px; background: #f0f9ff; border: 3px solid #87ceeb; border-radius: 15px; padding: 30px; text-align: center; font-weight: 700; font-size: 2rem; color: #0D5791; animation: pulse-green 1s ease; }

      /* Animations */
      @keyframes pop-in {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes pulse-green {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes shake-red {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
      }

      /* Footer */
      .footer { background-color: #0a4a82; color: white; padding: 20px; text-align: center; margin-top: auto; }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🧩</div>
          <h2>Module 3: Cognitive Skills</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading activity...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="puzzle-board" id="puzzleBoard">
          </div>

        <div class="options-title" id="optionsTitle">Tap the correct answer to complete the puzzle:</div>
        <div class="options-grid" id="optionsGrid">
          </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">
          Next Puzzle <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // The Curriculum Data for Cognitive Skills (Patterns, Matching, Sorting)
      const questions = [
        {
          instruction: "What comes next in the pattern?",
          sequence: ["🔴", "🔵", "🔴", "?"],
          options: ["🔴", "🔵", "🟡"],
          answer: "🔵"
        },
        {
          instruction: "Match the shape! Find the other star.",
          sequence: ["⭐", "➡️", "?"],
          options: ["⬛", "⭐", "⚪"],
          answer: "⭐"
        },
        {
          instruction: "Sort the items. Which one is a fruit?",
          sequence: ["🍎", "🍌", "🍇", "?"],
          options: ["🚗", "🍓", "🐕"],
          answer: "🍓"
        },
        {
          instruction: "Find the matching size. Which one is BIG?",
          sequence: ["🐘", "➡️", "?"],
          options: ["🐜", "🐁", "🐘"],
          answer: "🐘"
        }
      ];

      let currentIdx = 0;
      let score = 0;
      let answered = false;
      let currentQuestion = null;

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const puzzleBoardEl = document.getElementById("puzzleBoard");
      const optionsGridEl = document.getElementById("optionsGrid");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");
      const optionsTitle = document.getElementById("optionsTitle");

      // Text to Speech Function
      function speakText(text) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-IN";
        utterance.rate = 0.9; 
        window.speechSynthesis.speak(utterance);
      }

      function loadQuestion() {
        answered = false;
        nextBtn.disabled = true;
        nextBtn.style.display = "none";
        currentQuestion = questions[currentIdx];
        
        // Update text
        questionTextEl.textContent = currentQuestion.instruction;
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";

        // Build the Puzzle Sequence
        puzzleBoardEl.innerHTML = "";
        currentQuestion.sequence.forEach((item, index) => {
          const div = document.createElement("div");
          
          if (item === "?") {
            div.className = "sequence-item slot-empty";
            div.id = "targetSlot";
            div.textContent = "?";
          } else if (item === "➡️") {
            div.className = "sequence-item arrow";
            div.textContent = "➡️";
          } else {
            div.className = "sequence-item";
            div.textContent = item;
          }
          
          puzzleBoardEl.appendChild(div);
        });

        // Build the Options
        optionsGridEl.innerHTML = "";
        currentQuestion.options.forEach((emoji) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = emoji;
          btn.onclick = () => selectOption(btn, emoji);
          optionsGridEl.appendChild(btn);
        });

        // Read instructions automatically after a tiny delay
        setTimeout(() => speakText(currentQuestion.instruction), 600);
      }

      function selectOption(btn, selectedEmoji) {
        if (answered) return;
        answered = true;

        // Disable all buttons to prevent double-clicking
        Array.from(optionsGridEl.children).forEach(b => b.style.pointerEvents = 'none');
        const targetSlot = document.getElementById("targetSlot");

        if (selectedEmoji === currentQuestion.answer) {
          score++;
          
          // Animate the button
          btn.classList.add("correct");
          
          // Animate the puzzle slot filling up
          targetSlot.textContent = selectedEmoji;
          targetSlot.classList.remove("slot-empty");
          targetSlot.classList.add("slot-filled");

          feedbackEl.textContent = "✓ Brilliant! You solved it.";
          feedbackEl.classList.add("show", "correct-text");
          speakText("Brilliant! You solved it.");
          
          nextBtn.disabled = false;
          nextBtn.style.display = "block";

        } else {
          // If incorrect
          btn.classList.add("incorrect");
          feedbackEl.textContent = "✗ Not quite. Let's see the right answer.";
          feedbackEl.classList.add("show", "incorrect-text");
          speakText("Not quite. Let's see the right answer.");
          
          // Show the correct answer automatically
          setTimeout(() => {
            Array.from(optionsGridEl.children).forEach(b => {
              if (b.textContent === currentQuestion.answer) {
                b.classList.add("correct");
              }
            });
            targetSlot.textContent = currentQuestion.answer;
            targetSlot.classList.remove("slot-empty");
            targetSlot.classList.add("slot-filled");
            
            nextBtn.disabled = false;
            nextBtn.style.display = "block";
          }, 1500);
        }
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Quiz
          questionTextEl.textContent = "Module Completed! 🎉";
          document.querySelector(".speaker-icon").style.display = "none";
          puzzleBoardEl.style.display = "none";
          optionsGridEl.style.display = "none";
          optionsTitle.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `Amazing logic!<br>You solved ${score} out of ${questions.length} puzzles! 🧠✨`;
          speakText(`Amazing logic! You completed the Cognitive Skills module.`);
        }
      }

      // Start the module
      loadQuestion();
    </script>
  </body>
</html>
