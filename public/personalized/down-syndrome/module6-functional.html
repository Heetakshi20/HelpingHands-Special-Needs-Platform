<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 6 - Functional Learning</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
      /* Base styles and Warm, Cheerful Color Palette */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Poppins", sans-serif; background: linear-gradient(135deg, #FFEFBA 0%, #FFFFFF 100%); min-height: 100vh; display: flex; flex-direction: column; }

      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #FF9A9E; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .logo { font-size: 26px; font-weight: bold; cursor: pointer;}
      .logo span { color: #FFF176; }
      .nav-links { list-style: none; display: flex; gap: 20px; flex: 1; justify-content: center; }
      .nav-links a { text-decoration: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 5px; transition: 0.3s; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.3); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); border: 4px solid #FF9A9E; }

      /* Header */
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #FF9A9E; padding-bottom: 15px; }
      .header-icon { width: 55px; height: 55px; background: #FF9A9E; border-radius: 50%; color: white; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: #D81B60; font-weight: 700; font-size: 1.8rem; }

      /* Instruction Bar */
      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #FFF9C4; padding: 20px 30px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #FFF176; }
      .question-text { font-size: 1.6rem; font-weight: 700; color: #D81B60; flex: 1; }
      
      .speaker-icon { width: 60px; height: 60px; background: #FFB74D; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(255,183,77,0.4); flex-shrink: 0; margin-left: 15px; }
      .speaker-icon:hover { background: #F57C00; transform: scale(1.1); }

      /* Scenario Visual */
      .scenario-box { background: #FAFAFA; border: 4px dashed #E0E0E0; border-radius: 20px; min-height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 30px; padding: 20px; animation: pop-in 0.5s ease; }
      .scenario-emoji { font-size: 6rem; margin-bottom: 10px; }

      /* Options Grid */
      .options-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; width: 100%; margin-bottom: 30px; }
      
      .option-btn { background: #fff; border: 5px solid #E0E0E0; border-radius: 25px; width: 220px; padding: 25px 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.05); user-select: none; }
      .option-btn:hover { border-color: #4FC3F7; transform: translateY(-8px); box-shadow: 0 15px 25px rgba(79, 195, 247, 0.2); }
      .option-btn:active { transform: translateY(0); }
      
      .option-emoji { font-size: 5rem; margin-bottom: 15px; }
      .option-text { font-size: 1.4rem; font-weight: 800; color: #0288D1; text-align: center; line-height: 1.2; }

      .option-btn.correct { background: #E8F5E9; border-color: #4CAF50; animation: pop-in 0.5s ease; pointer-events: none; }
      .option-btn.correct .option-text { color: #2E7D32; }
      
      .option-btn.incorrect { background: #FFEBEE; border-color: #EF5350; opacity: 0.5; animation: shake-red 0.4s ease; pointer-events: none; transform: scale(0.95); }
      .option-btn.incorrect .option-text { color: #C62828; }

      /* Feedback & Controls */
      .feedback { text-align: center; font-size: 1.8rem; font-weight: 800; min-height: 50px; margin-bottom: 20px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: #2E7D32; }
      .feedback.incorrect-text { color: #D81B60; }

      .next-btn { background: linear-gradient(135deg, #4CAF50, #388E3C); color: white; border: none; border-radius: 15px; padding: 18px 50px; font-weight: 800; font-size: 1.5rem; cursor: pointer; display: block; margin: 0 auto; transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3); }
      .next-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4); }
      .next-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; display: none; }

      .score-box { display: none; margin-top: 30px; background: #FFF9C4; border: 4px solid #FFEB3B; border-radius: 20px; padding: 40px; text-align: center; font-weight: 800; font-size: 2.5rem; color: #F57C00; animation: pop-in 1s ease; }

      /* Animations */
      @keyframes pop-in { 0% { transform: scale(0.8); opacity: 0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
      @keyframes shake-red { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

      /* Footer */
      .footer { background-color: #D81B60; color: white; padding: 20px; text-align: center; margin-top: auto; }

      @media(max-width: 600px) {
        .option-btn { width: 130px; padding: 15px; }
        .option-emoji { font-size: 3.5rem; }
        .option-text { font-size: 1.1rem; }
        .scenario-emoji { font-size: 4rem; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index2.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index2.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🛒</div>
          <h2>Module 6: Functional Learning</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="scenario-box" id="scenarioBox">
          <div class="scenario-emoji" id="scenarioEmoji">🤔</div>
        </div>

        <div class="options-grid" id="optionsGrid">
          </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">
          Next Activity ⭐
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // Curriculum Data: Mixes Daily Objects, Decision Making, and Money
      const questions = [
        {
          instruction: "It is time to brush your teeth! What do you need?",
          scenarioEmoji: "🦷",
          options: [
            { text: "Toothbrush", emoji: "🪥", isCorrect: true },
            { text: "Spoon", emoji: "🥄", isCorrect: false }
          ]
        },
        {
          instruction: "It is raining outside! What should we take?",
          scenarioEmoji: "🌧️",
          options: [
            { text: "Umbrella", emoji: "☔", isCorrect: true },
            { text: "Sunglasses", emoji: "🕶️", isCorrect: false }
          ]
        },
        {
          instruction: "We want to buy an apple at the store. What do we give the cashier?",
          scenarioEmoji: "🏪",
          options: [
            { text: "Money", emoji: "💵", isCorrect: true },
            { text: "A Leaf", emoji: "🍃", isCorrect: false }
          ]
        },
        {
          instruction: "You are very thirsty. What do you put water in?",
          scenarioEmoji: "🚰",
          options: [
            { text: "A Book", emoji: "📖", isCorrect: false },
            { text: "A Cup", emoji: "🥤", isCorrect: true }
          ]
        }
      ];

      let currentIdx = 0;
      let score = 0;
      let answered = false;
      let currentQuestion = null;

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const scenarioEmojiEl = document.getElementById("scenarioEmoji");
      const optionsGridEl = document.getElementById("optionsGrid");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function (Slow, encouraging pacing)
      function speakText(text) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-IN";
        utterance.rate = 0.8; 
        window.speechSynthesis.speak(utterance);
      }

      function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
      }

      function loadQuestion() {
        answered = false;
        currentQuestion = questions[currentIdx];
        
        // Reset UI
        questionTextEl.textContent = currentQuestion.instruction;
        scenarioEmojiEl.textContent = currentQuestion.scenarioEmoji;
        
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";
        nextBtn.disabled = true;

        // Populate Options (Shuffled so the correct answer isn't always on the left)
        optionsGridEl.innerHTML = "";
        const shuffledOptions = shuffleArray(currentQuestion.options);
        
        shuffledOptions.forEach((option) => {
          const btn = document.createElement("div");
          btn.className = "option-btn";
          btn.innerHTML = `
            <div class="option-emoji">${option.emoji}</div>
            <div class="option-text">${option.text}</div>
          `;
          btn.onclick = () => handleOptionClick(btn, option);
          optionsGridEl.appendChild(btn);
        });

        // Automatically read instruction
        setTimeout(() => speakText(currentQuestion.instruction), 600);
      }

      function handleOptionClick(btnElement, optionData) {
        if (answered) return;

        // Speak the option they clicked
        speakText(optionData.text);

        if (!optionData.isCorrect) {
          // Incorrect: Shake, turn gray, give gentle redirection
          btnElement.classList.add("incorrect");
          
          setTimeout(() => {
             speakText("Oops! Try looking at the other picture.");
             feedbackEl.textContent = "Oops! Try the other picture.";
             feedbackEl.className = "feedback show incorrect-text";
          }, 1000); 
          return;
        }

        // Correct!
        answered = true;
        score++;
        
        // Lock other buttons
        Array.from(optionsGridEl.children).forEach(btn => btn.style.pointerEvents = "none");
        
        btnElement.classList.add("correct");
        
        setTimeout(() => {
          feedbackEl.className = "feedback show correct-text";
          feedbackEl.textContent = `⭐ Yes! The ${optionData.text}!`;
          speakText(`Yes! The ${optionData.text}. Great job.`);

          setTimeout(() => {
            nextBtn.disabled = false;
            nextBtn.style.display = "block";
          }, 1800);
        }, 800);
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Module
          document.querySelector(".question-bar").style.display = "none";
          document.getElementById("scenarioBox").style.display = "none";
          optionsGridEl.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `You are so smart!<br>You know how to do things all by yourself! 🛒👏`;
          speakText(`You are so smart! You finished the Functional Learning module. You know how to do things all by yourself.`);
        }
      }

      // Initialize
      loadQuestion();
    </script>
  </body>
</html>
