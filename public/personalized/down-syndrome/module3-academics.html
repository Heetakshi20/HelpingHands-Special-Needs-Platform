<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 3 - Basic Academics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
      /* Base styles and Warm, Cheerful Color Palette */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Poppins", sans-serif; background: linear-gradient(135deg, #FFEFBA 0%, #FFFFFF 100%); min-height: 100vh; display: flex; flex-direction: column; }

      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #FF9A9E; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .logo { font-size: 26px; font-weight: bold; cursor: pointer;}
      .logo span { color: #FFF176; }
      .nav-links { list-style: none; display: flex; gap: 20px; flex: 1; justify-content: center; }
      .nav-links a { text-decoration: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 5px; transition: 0.3s; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.3); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); border: 4px solid #FF9A9E; }

      /* Header */
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #FF9A9E; padding-bottom: 15px; }
      .header-icon { width: 55px; height: 55px; background: #FF9A9E; border-radius: 50%; color: white; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: #D81B60; font-weight: 700; font-size: 1.8rem; }

      /* Instruction Bar */
      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #FFF9C4; padding: 20px 30px; border-radius: 15px; margin-bottom: 30px; border: 2px solid #FFF176; }
      .question-text { font-size: 1.6rem; font-weight: 700; color: #D81B60; flex: 1; }
      
      .speaker-icon { width: 60px; height: 60px; background: #FFB74D; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(255,183,77,0.4); flex-shrink: 0; margin-left: 15px; }
      .speaker-icon:hover { background: #F57C00; transform: scale(1.1); }

      /* Visual Prompt Area (Where items to count or add are shown) */
      .visual-area { background: #FAFAFA; border: 4px dashed #E0E0E0; border-radius: 20px; min-height: 200px; display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 30px; padding: 30px; flex-wrap: wrap; font-size: 5rem; animation: pop-in 0.5s ease; text-align: center; }
      .math-symbol { font-size: 4rem; color: #D81B60; font-weight: 800; margin: 0 15px; }
      .visual-group { display: flex; gap: 10px; background: white; padding: 10px 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }

      /* Options Grid */
      .options-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; width: 100%; margin-bottom: 30px; }
      
      .option-btn { background: #fff; border: 5px solid #E0E0E0; border-radius: 25px; width: 150px; height: 150px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 4.5rem; font-weight: 800; color: #0288D1; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.05); user-select: none; }
      .option-btn:hover { border-color: #4FC3F7; transform: translateY(-8px); box-shadow: 0 15px 25px rgba(79, 195, 247, 0.2); color: #0277BD; }
      .option-btn:active { transform: translateY(0); }
      
      .option-btn.correct { background: #E8F5E9; border-color: #4CAF50; color: #2E7D32; animation: pop-in 0.5s ease; pointer-events: none; }
      .option-btn.incorrect { background: #FFEBEE; border-color: #EF5350; color: #C62828; opacity: 0.5; animation: shake-red 0.4s ease; pointer-events: none; transform: scale(0.95); }

      /* Feedback & Controls */
      .feedback { text-align: center; font-size: 1.8rem; font-weight: 800; min-height: 50px; margin-bottom: 20px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: #2E7D32; }
      .feedback.incorrect-text { color: #D81B60; }

      .next-btn { background: linear-gradient(135deg, #4CAF50, #388E3C); color: white; border: none; border-radius: 15px; padding: 18px 50px; font-weight: 800; font-size: 1.5rem; cursor: pointer; display: block; margin: 0 auto; transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3); }
      .next-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4); }
      .next-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; display: none; }

      .score-box { display: none; margin-top: 30px; background: #FFF9C4; border: 4px solid #FFEB3B; border-radius: 20px; padding: 40px; text-align: center; font-weight: 800; font-size: 2.5rem; color: #F57C00; animation: pop-in 1s ease; }

      /* Animations */
      @keyframes pop-in {
        0% { transform: scale(0.8); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes shake-red {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }

      /* Footer */
      .footer { background-color: #D81B60; color: white; padding: 20px; text-align: center; margin-top: auto; }

      @media(max-width: 600px) {
        .option-btn { width: 100px; height: 100px; font-size: 3rem; }
        .visual-area { font-size: 3rem; padding: 15px; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index2.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index2.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">📚</div>
          <h2>Module 3: Academics</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="visual-area" id="visualArea">
          </div>

        <div class="options-grid" id="optionsGrid">
          </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">
          Next Question ⭐
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // Curriculum Data: Mixes Alphabet, Counting, and Object-Addition
      const questions = [
        {
          type: "alphabet",
          instruction: "A is for Apple! Find the letter A.",
          visuals: ["🍎"],
          options: ["B", "A", "C"],
          answer: "A"
        },
        {
          type: "counting",
          instruction: "Let's count! How many balloons?",
          visuals: ["🎈", "🎈", "🎈"],
          options: ["2", "3", "4"],
          answer: "3"
        },
        {
          type: "addition",
          instruction: "Let's add! One car plus one car makes...",
          visual1: ["🚗"],
          visual2: ["🚗"],
          options: ["1", "2", "3"],
          answer: "2"
        },
        {
          type: "counting",
          instruction: "Can you count the stars?",
          visuals: ["⭐", "⭐", "⭐", "⭐"],
          options: ["3", "4", "5"],
          answer: "4"
        },
        {
          type: "alphabet",
          instruction: "D is for Dog. Find the letter D.",
          visuals: ["🐕"],
          options: ["D", "P", "B"],
          answer: "D"
        }
      ];

      let currentIdx = 0;
      let score = 0;
      let answered = false;
      let currentQuestion = null;

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const visualAreaEl = document.getElementById("visualArea");
      const optionsGridEl = document.getElementById("optionsGrid");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function (Slowed down for comprehension)
      function speakText(text) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-IN";
        utterance.rate = 0.8; 
        window.speechSynthesis.speak(utterance);
      }

      function renderVisuals() {
        visualAreaEl.innerHTML = "";

        if (currentQuestion.type === "addition") {
          // Render Math Problem: [Group 1] + [Group 2]
          const group1 = document.createElement("div");
          group1.className = "visual-group";
          group1.innerHTML = currentQuestion.visual1.join("");
          
          const plus = document.createElement("div");
          plus.className = "math-symbol";
          plus.textContent = "+";
          
          const group2 = document.createElement("div");
          group2.className = "visual-group";
          group2.innerHTML = currentQuestion.visual2.join("");

          const equals = document.createElement("div");
          equals.className = "math-symbol";
          equals.textContent = "=";
          
          const questionMark = document.createElement("div");
          questionMark.className = "math-symbol";
          questionMark.style.color = "#ccc";
          questionMark.textContent = "?";

          visualAreaEl.append(group1, plus, group2, equals, questionMark);
        } else {
          // Render Alphabet or Counting (just display items)
          currentQuestion.visuals.forEach(emoji => {
            const span = document.createElement("span");
            span.textContent = emoji;
            visualAreaEl.appendChild(span);
          });
        }
      }

      function loadQuestion() {
        answered = false;
        currentQuestion = questions[currentIdx];
        
        // Reset UI
        questionTextEl.textContent = currentQuestion.instruction;
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";
        nextBtn.disabled = true;

        // Render Top Visuals
        renderVisuals();

        // Populate Options
        optionsGridEl.innerHTML = "";
        currentQuestion.options.forEach((option) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = option;
          btn.onclick = () => handleOptionClick(btn, option);
          optionsGridEl.appendChild(btn);
        });

        // Automatically read instruction
        setTimeout(() => speakText(currentQuestion.instruction), 600);
      }

      function handleOptionClick(btnElement, selectedText) {
        if (answered) return;

        // Speak the option they clicked
        speakText(selectedText);

        if (selectedText !== currentQuestion.answer) {
          // Incorrect: Shake, turn gray, but don't punish heavily
          btnElement.classList.add("incorrect");
          
          setTimeout(() => {
             speakText("Oops! Try again.");
             feedbackEl.textContent = "Oops! Try again.";
             feedbackEl.className = "feedback show incorrect-text";
          }, 800); // Wait for them to hear the letter/number they clicked
          return;
        }

        // Correct!
        answered = true;
        score++;
        
        // Lock other buttons
        Array.from(optionsGridEl.children).forEach(btn => btn.style.pointerEvents = "none");
        
        btnElement.classList.add("correct");
        
        setTimeout(() => {
          feedbackEl.className = "feedback show correct-text";
          feedbackEl.textContent = "⭐ Amazing! That is right.";
          speakText("Amazing! That is right.");

          setTimeout(() => {
            nextBtn.disabled = false;
            nextBtn.style.display = "block";
          }, 1500);
        }, 800);
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Module
          document.querySelector(".question-bar").style.display = "none";
          visualAreaEl.style.display = "none";
          optionsGridEl.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `You are so smart!<br>You finished all your work! 🎓⭐`;
          speakText(`You are so smart! You finished the Academics module.`);
        }
      }

      // Initialize
      loadQuestion();
    </script>
  </body>
</html>
