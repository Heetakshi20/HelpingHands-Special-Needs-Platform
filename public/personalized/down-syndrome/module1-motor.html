<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 1 - Motor Skills</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
      /* Base styles */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Times New Roman', Times, serif; background: linear-gradient(135deg, #FFEFBA 0%, #FFFFFF 100%); min-height: 100vh; display: flex; flex-direction: column; }

      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #FF9A9E; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .logo { font-size: 26px; font-weight: bold; cursor: pointer;}
      .logo span { color: #FFF176; }
      .nav-links { list-style: none; display: flex; gap: 20px; flex: 1; justify-content: center; }
      .nav-links a { text-decoration: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 5px; transition: 0.3s; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.3); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); border: 4px solid #FF9A9E; }

      /* Header & TTS */
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #FF9A9E; padding-bottom: 15px; }
      .header-icon { width: 55px; height: 55px; background: #FF9A9E; border-radius: 50%; color: white; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: #D81B60; font-weight: 700; font-size: 1.8rem; }

      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #FFF9C4; padding: 20px 30px; border-radius: 15px; margin-bottom: 30px; border: 2px solid #FFF176; }
      .question-text { font-size: 1.8rem; font-weight: 700; color: #D81B60; }
      
      .speaker-icon { width: 60px; height: 60px; background: #FFB74D; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(255,183,77,0.4); flex-shrink: 0; }
      .speaker-icon:hover { background: #F57C00; transform: scale(1.1); }

      /* Dynamic Game Area */
      .game-area { min-height: 300px; background: #FAFAFA; border: 3px dashed #E0E0E0; border-radius: 20px; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; padding: 20px; gap: 30px; flex-wrap: wrap; }

      /* Interactive Targets (Extra Large for Motor Skills) */
      .target-btn { width: 140px; height: 140px; background: #fff; border: 5px solid #FF9A9E; border-radius: 50%; font-size: 5rem; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s; box-shadow: 0 8px 15px rgba(216, 27, 96, 0.15); user-select: none; }
      .target-btn:hover { transform: scale(1.05); border-color: #D81B60; }
      .target-btn:active { transform: scale(0.95); }
      
      /* Specific to 'Sequence/Tracing' task */
      .target-btn.sequence { font-size: 4rem; color: #D81B60; font-weight: 800; border-color: #4FC3F7; background: #E1F5FE; }
      .target-btn.sequence.completed { background: #A5D6A7; border-color: #2E7D32; color: #1B5E20; transform: scale(1.1); opacity: 0.8; pointer-events: none; }
      
      /* Feedback & Controls */
      .feedback { text-align: center; font-size: 1.8rem; font-weight: 800; min-height: 50px; margin-bottom: 20px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: #2E7D32; animation: pop-in 0.5s ease; }
      .feedback.incorrect-text { color: #D81B60; animation: shake-red 0.4s ease; }

      .next-btn { background: linear-gradient(135deg, #4CAF50, #388E3C); color: white; border: none; border-radius: 15px; padding: 18px 50px; font-weight: 800; font-size: 1.5rem; cursor: pointer; display: block; margin: 0 auto; transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3); }
      .next-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4); }
      .next-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; display: none; }

      .score-box { display: none; margin-top: 30px; background: #FFF9C4; border: 4px solid #FFEB3B; border-radius: 20px; padding: 40px; text-align: center; font-weight: 800; font-size: 2.5rem; color: #F57C00; animation: pop-in 1s ease; }

      /* Animations */
      @keyframes pop-in {
        0% { transform: scale(0.8); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes shake-red {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }

      .footer { background-color: #D81B60; color: white; padding: 20px; text-align: center; margin-top: auto; }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index2.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index2.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🖍️</div>
          <h2>Module 1: Motor Skills</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading game...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="game-area" id="gameArea">
           </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">
          Next Game ⭐
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // State-driven curriculum data
      const questions = [
        {
          type: "single",
          instruction: "Tap the big red apple!",
          items: ["🍎"]
        },
        {
          type: "multi",
          instruction: "Pop all 3 balloons!",
          items: ["🎈", "🎈", "🎈"]
        },
        {
          type: "sequence",
          instruction: "Connect the dots! Tap 1, then 2, then 3.",
          items: ["1", "2", "3"] // Forces fine motor control and sequence following
        }
      ];

      let currentIdx = 0;
      let score = 0;
      let currentQuestion = null;
      
      // State for specific games
      let itemsClickedCount = 0;
      let currentExpectedNumber = 1;

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const gameAreaEl = document.getElementById("gameArea");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function (Slowed down slightly for comprehension)
      function speakText(text) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-IN";
        utterance.rate = 0.8; 
        window.speechSynthesis.speak(utterance);
      }

      function loadQuestion() {
        currentQuestion = questions[currentIdx];
        questionTextEl.textContent = currentQuestion.instruction;
        
        // Reset State
        itemsClickedCount = 0;
        currentExpectedNumber = 1;
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";
        nextBtn.disabled = true;
        gameAreaEl.innerHTML = "";

        // Render targets based on game type
        currentQuestion.items.forEach((item, index) => {
          const btn = document.createElement("div");
          btn.className = "target-btn";
          
          if (currentQuestion.type === "sequence") {
            btn.classList.add("sequence");
            btn.textContent = item;
            btn.onclick = () => handleSequenceClick(btn, parseInt(item));
          } else {
            btn.textContent = item;
            btn.onclick = () => handleBasicClick(btn);
          }
          
          gameAreaEl.appendChild(btn);
        });

        // Auto-read the instruction
        setTimeout(() => speakText(currentQuestion.instruction), 600);
      }

      // Handler for Single or Multi-target games
      function handleBasicClick(btn) {
        // Prevent double clicking the same button
        if(btn.style.opacity === "0") return;

        speakText("Pop!");
        btn.style.opacity = "0"; // Make it "pop" and disappear
        btn.style.pointerEvents = "none";
        
        itemsClickedCount++;
        
        if (itemsClickedCount === currentQuestion.items.length) {
          triggerSuccess("Great job! You got them all!");
        }
      }

      // Handler for Tracing/Sequence games (1 -> 2 -> 3)
      function handleSequenceClick(btn, numberClicked) {
        if (numberClicked === currentExpectedNumber) {
          // Correct sequence!
          speakText(numberClicked.toString());
          btn.classList.add("completed");
          currentExpectedNumber++;

          if (currentExpectedNumber > currentQuestion.items.length) {
            triggerSuccess("Perfect! You connected the dots!");
          }
        } else {
          // Wrong order! Gentle correction.
          speakText("Oops! Try number " + currentExpectedNumber);
          feedbackEl.textContent = "Find number " + currentExpectedNumber + "!";
          feedbackEl.className = "feedback show incorrect-text";
          
          // Remove feedback after a moment
          setTimeout(() => {
            if (currentExpectedNumber <= currentQuestion.items.length) {
                feedbackEl.className = "feedback";
            }
          }, 2000);
        }
      }

      function triggerSuccess(message) {
        score++;
        feedbackEl.textContent = "⭐ " + message;
        feedbackEl.className = "feedback show correct-text";
        
        // Wait just a moment before speaking to let the 'Pop' or number finish
        setTimeout(() => {
            speakText(message);
        }, 500);

        nextBtn.disabled = false;
        nextBtn.style.display = "block";
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Module
          questionTextEl.textContent = "You did it! 🎉";
          document.querySelector(".speaker-icon").style.display = "none";
          gameAreaEl.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `Amazing!<br>Your hands are getting so strong! 👏🎈`;
          speakText(`Amazing! You finished the Motor Skills module.`);
        }
      }

      // Initialize
      loadQuestion();
    </script>
  </body>
</html>
