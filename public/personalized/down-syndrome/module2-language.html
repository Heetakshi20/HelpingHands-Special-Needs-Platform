<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 2 - Language & Communication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
      /* Base styles and Warm, Cheerful Color Palette */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Times New Roman', Times, serif; background: linear-gradient(135deg, #FFEFBA 0%, #FFFFFF 100%); min-height: 100vh; display: flex; flex-direction: column; }

      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #FF9A9E; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .logo { font-size: 26px; font-weight: bold; cursor: pointer;}
      .logo span { color: #FFF176; }
      .nav-links { list-style: none; display: flex; gap: 20px; flex: 1; justify-content: center; }
      .nav-links a { text-decoration: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 5px; transition: 0.3s; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.3); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); border: 4px solid #FF9A9E; }

      /* Header */
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #FF9A9E; padding-bottom: 15px; }
      .header-icon { width: 55px; height: 55px; background: #FF9A9E; border-radius: 50%; color: white; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: #D81B60; font-weight: 700; font-size: 1.8rem; }

      /* Instruction Bar */
      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #FFF9C4; padding: 20px 30px; border-radius: 15px; margin-bottom: 30px; border: 2px solid #FFF176; text-align: center; justify-content: center; }
      .question-text { font-size: 1.8rem; font-weight: 700; color: #D81B60; }

      /* Interactive Game Area */
      .game-area { display: flex; flex-direction: column; align-items: center; gap: 40px; margin-bottom: 30px; }

      /* Big Listen Button */
      .listen-btn { width: 120px; height: 120px; background: linear-gradient(135deg, #4FC3F7, #0288D1); border: 6px solid #B3E5FC; border-radius: 50%; color: white; font-size: 4rem; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(2, 136, 209, 0.3); }
      .listen-btn:hover { transform: scale(1.1); box-shadow: 0 12px 25px rgba(2, 136, 209, 0.4); }
      .listen-btn:active { transform: scale(0.95); }
      .listen-label { font-size: 1.2rem; font-weight: 700; color: #0288D1; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
      .listen-container { display: flex; flex-direction: column; align-items: center; }

      /* Options Grid */
      .options-grid { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; width: 100%; }
      
      .option-card { background: #fff; border: 5px solid #E0E0E0; border-radius: 25px; padding: 30px 20px; width: 220px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
      .option-card:hover { border-color: #FF9A9E; transform: translateY(-8px); box-shadow: 0 15px 25px rgba(216, 27, 96, 0.15); }
      
      .option-emoji { font-size: 6rem; margin-bottom: 15px; transition: transform 0.3s ease; }
      .option-card:hover .option-emoji { transform: scale(1.1); }
      
      .option-card.correct { background: #E8F5E9; border-color: #4CAF50; animation: pop-in 0.5s ease; pointer-events: none; }
      .option-card.incorrect { background: #FFEBEE; border-color: #EF5350; opacity: 0.6; animation: shake-red 0.4s ease; pointer-events: none; }

      /* Feedback & Prompts */
      .feedback { text-align: center; font-size: 1.8rem; font-weight: 800; min-height: 80px; margin-bottom: 20px; opacity: 0; transition: opacity 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: #2E7D32; }
      .feedback.incorrect-text { color: #D81B60; }
      
      .speak-prompt { font-size: 2.2rem; color: #F57C00; margin-top: 10px; animation: pulse-orange 1.5s infinite; display: none; }
      .speak-prompt.show { display: block; }

      /* Controls */
      .next-btn { background: linear-gradient(135deg, #4CAF50, #388E3C); color: white; border: none; border-radius: 15px; padding: 18px 50px; font-weight: 800; font-size: 1.5rem; cursor: pointer; display: block; margin: 0 auto; transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3); }
      .next-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4); }
      .next-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; display: none; }

      .score-box { display: none; margin-top: 30px; background: #FFF9C4; border: 4px solid #FFEB3B; border-radius: 20px; padding: 40px; text-align: center; font-weight: 800; font-size: 2.5rem; color: #F57C00; animation: pop-in 1s ease; }

      /* Animations */
      @keyframes pop-in {
        0% { transform: scale(0.8); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes shake-red {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
      @keyframes pulse-orange {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* Footer */
      .footer { background-color: #D81B60; color: white; padding: 20px; text-align: center; margin-top: auto; }

      @media(max-width: 600px) {
        .option-card { width: 140px; padding: 15px 10px; }
        .option-emoji { font-size: 4rem; }
        .listen-btn { width: 90px; height: 90px; font-size: 3rem; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index2.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index2.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🗣️</div>
          <h2>Module 2: Language & Speaking</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Listen carefully, then find the picture!</div>
        </div>

        <div class="game-area" id="gameArea">
          
          <div class="listen-container">
            <button class="listen-btn" onclick="playTargetWord()" title="Listen to the word">
              <i class="fas fa-volume-up"></i>
            </button>
            <div class="listen-label">Tap to Listen</div>
          </div>

          <div class="options-grid" id="optionsGrid">
            </div>

        </div>

        <div id="feedback" class="feedback">
          <div id="feedbackMsg"></div>
          <div id="speakPrompt" class="speak-prompt">🗣️ "Apple"</div>
        </div>

        <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">
          Next Word ➡️
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // State-driven curriculum data for early vocabulary
      const questions = [
        {
          targetWord: "Apple",
          options: [
            { text: "Apple", emoji: "🍎" },
            { text: "Dog", emoji: "🐕" }
          ]
        },
        {
          targetWord: "Ball",
          options: [
            { text: "Car", emoji: "🚗" },
            { text: "Ball", emoji: "⚽" }
          ]
        },
        {
          targetWord: "Cat",
          options: [
            { text: "Cat", emoji: "🐱" },
            { text: "Shoe", emoji: "👟" }
          ]
        },
        {
          targetWord: "Car",
          options: [
            { text: "Car", emoji: "🚗" },
            { text: "Apple", emoji: "🍎" }
          ]
        }
      ];

      let currentIdx = 0;
      let score = 0;
      let answered = false;
      let currentQuestion = null;

      // DOM Elements
      const optionsGridEl = document.getElementById("optionsGrid");
      const feedbackEl = document.getElementById("feedback");
      const feedbackMsg = document.getElementById("feedbackMsg");
      const speakPrompt = document.getElementById("speakPrompt");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function (Slow, clear pacing for Down Syndrome learners)
      function speakText(text, rate = 0.75) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-IN";
        utterance.rate = rate; 
        window.speechSynthesis.speak(utterance);
      }

      // Shuffles the cards so the correct answer isn't always in the same place
      function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
      }

      function loadQuestion() {
        answered = false;
        currentQuestion = questions[currentIdx];
        
        // Reset UI
        feedbackEl.className = "feedback";
        feedbackMsg.textContent = "";
        speakPrompt.classList.remove("show");
        nextBtn.style.display = "none";
        nextBtn.disabled = true;

        // Populate Cards
        optionsGridEl.innerHTML = "";
        const shuffledOptions = shuffleArray(currentQuestion.options);
        
        shuffledOptions.forEach((option) => {
          const card = document.createElement("div");
          card.className = "option-card";
          card.innerHTML = `<div class="option-emoji">${option.emoji}</div>`;
          card.onclick = () => handleCardClick(card, option.text);
          optionsGridEl.appendChild(card);
        });

        // Automatically play the target word to prompt the user
        setTimeout(() => playTargetWord(), 800);
      }

      function playTargetWord() {
        // Just say the word clearly
        speakText(currentQuestion.targetWord);
      }

      function handleCardClick(cardElement, selectedText) {
        if (answered) return;

        // If they click the WRONG card
        if (selectedText !== currentQuestion.targetWord) {
          cardElement.classList.add("incorrect");
          speakText("Oops! Try again. Find the " + currentQuestion.targetWord);
          
          // Re-enable clicking after a brief pause
          setTimeout(() => {
            cardElement.classList.remove("incorrect");
          }, 1500);
          return;
        }

        // If they click the RIGHT card
        answered = true;
        score++;
        
        // Lock other cards
        Array.from(optionsGridEl.children).forEach(c => c.style.pointerEvents = "none");
        
        cardElement.classList.add("correct");
        
        // 1. Acknowledge success
        feedbackEl.className = "feedback show correct-text";
        feedbackMsg.textContent = "⭐ Great job!";
        speakText("Great job!");

        // 2. Prompt verbal repetition after a slight delay
        setTimeout(() => {
          feedbackMsg.textContent = "Now you say it out loud:";
          speakPrompt.textContent = `🗣️ "${currentQuestion.targetWord}"`;
          speakPrompt.classList.add("show");
          
          // Speak the prompt
          speakText("Now you say it. " + currentQuestion.targetWord, 0.6); // Slightly slower for the final prompt

          // 3. Show Next Button
          setTimeout(() => {
            nextBtn.disabled = false;
            nextBtn.style.display = "block";
          }, 2000);

        }, 1500);
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Module
          document.querySelector(".question-bar").style.display = "none";
          document.getElementById("gameArea").style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `Beautiful speaking!<br>You used your big words today! 🌟🎤`;
          speakText(`Beautiful speaking! You finished the Language module.`);
        }
      }

      // Initialize
      loadQuestion();
    </script>
  </body>
</html>
