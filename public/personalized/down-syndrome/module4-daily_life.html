<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 4 - Memory & Thinking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
      /* Base styles and Warm Color Palette */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: "Poppins", sans-serif; background: linear-gradient(135deg, #FFEFBA 0%, #FFFFFF 100%); min-height: 100vh; display: flex; flex-direction: column; }

      /* Navbar */
      .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #FF9A9E; color: white; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
      .logo { font-size: 26px; font-weight: bold; cursor: pointer;}
      .logo span { color: #FFF176; }
      .nav-links { list-style: none; display: flex; gap: 20px; flex: 1; justify-content: center; }
      .nav-links a { text-decoration: none; color: white; font-weight: bold; padding: 8px 14px; border-radius: 5px; transition: 0.3s; }
      .nav-links a:hover { background-color: rgba(255, 255, 255, 0.3); }

      /* Main Layout */
      .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
      .container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 900px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); border: 4px solid #FF9A9E; }

      /* Header */
      .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #FF9A9E; padding-bottom: 15px; }
      .header-icon { width: 55px; height: 55px; background: #FF9A9E; border-radius: 50%; color: white; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; }
      h2 { color: #D81B60; font-weight: 700; font-size: 1.8rem; }

      /* Instruction Bar */
      .question-bar { display: flex; justify-content: space-between; align-items: center; background: #FFF9C4; padding: 20px 30px; border-radius: 15px; margin-bottom: 30px; border: 2px solid #FFF176; }
      .question-text { font-size: 1.6rem; font-weight: 700; color: #D81B60; flex: 1; }
      
      .speaker-icon { width: 60px; height: 60px; background: #FFB74D; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(255,183,77,0.4); flex-shrink: 0; margin-left: 15px; }
      .speaker-icon:hover { background: #F57C00; transform: scale(1.1); }

      /* Interactive Game Area */
      .game-area { background: #FAFAFA; border: 4px dashed #E0E0E0; border-radius: 20px; min-height: 300px; display: flex; justify-content: center; align-items: center; margin-bottom: 30px; padding: 30px; }
      
      .card-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 600px; }

      /* 3D Memory Cards */
      .card { perspective: 1000px; width: 140px; height: 140px; cursor: pointer; user-select: none; }
      .card-inner { width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; position: relative; border-radius: 20px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
      
      .card.flipped .card-inner { transform: rotateY(180deg); }
      
      .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; justify-content: center; align-items: center; }
      
      /* The "Front" is the covered state (what the user sees before clicking) */
      .card-front { background: linear-gradient(135deg, #4FC3F7, #0288D1); border: 4px solid #0288D1; font-size: 3.5rem; color: rgba(255,255,255,0.8); }
      .card-front::after { content: '❓'; }
      
      /* The "Back" is the revealed emoji */
      .card-back { background: #FFFFFF; transform: rotateY(180deg); border: 4px solid #FF9A9E; font-size: 5rem; }
      
      .card.matched .card-back { background: #E8F5E9; border-color: #4CAF50; animation: pulse-green 0.5s ease; }
      .card.wrong .card-back { background: #FFEBEE; border-color: #EF5350; animation: shake-red 0.5s ease; }

      /* Feedback & Controls */
      .feedback { text-align: center; font-size: 1.8rem; font-weight: 800; min-height: 50px; margin-bottom: 20px; opacity: 0; transition: opacity 0.3s; }
      .feedback.show { opacity: 1; }
      .feedback.correct-text { color: #2E7D32; }
      .feedback.incorrect-text { color: #D81B60; }
      .feedback.neutral-text { color: #0288D1; animation: pulse-blue 1s infinite alternate; }

      .next-btn { background: linear-gradient(135deg, #4CAF50, #388E3C); color: white; border: none; border-radius: 15px; padding: 18px 50px; font-weight: 800; font-size: 1.5rem; cursor: pointer; display: block; margin: 0 auto; transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3); }
      .next-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4); }
      .next-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; display: none; }

      .score-box { display: none; margin-top: 30px; background: #FFF9C4; border: 4px solid #FFEB3B; border-radius: 20px; padding: 40px; text-align: center; font-weight: 800; font-size: 2.5rem; color: #F57C00; animation: pop-in 1s ease; }

      /* Animations */
      @keyframes pop-in { 0% { transform: scale(0.8); opacity: 0; } 60% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
      @keyframes pulse-green { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes shake-red { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
      @keyframes pulse-blue { from { opacity: 0.6; } to { opacity: 1; } }

      /* Footer */
      .footer { background-color: #D81B60; color: white; padding: 20px; text-align: center; margin-top: auto; }

      @media(max-width: 600px) {
        .card { width: 100px; height: 100px; }
        .card-front { font-size: 2.5rem; }
        .card-back { font-size: 3.5rem; }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="logo" onclick="window.location.href='index2.html'">Helping<span>Hands</span></div>
      <ul class="nav-links">
        <li><a href="index2.html">Back to Modules</a></li>
      </ul>
    </nav>

    <div class="main-wrapper">
      <div class="container">
        
        <div class="header">
          <div class="header-icon">🧩</div>
          <h2>Module 4: Memory & Thinking</h2>
        </div>

        <div class="question-bar">
          <div class="question-text" id="questionText">Loading...</div>
          <div class="speaker-icon" onclick="speakText(currentQuestion.instruction)" title="Read Aloud">
            <i class="fas fa-volume-up"></i>
          </div>
        </div>

        <div class="game-area">
          <div class="card-grid" id="cardGrid">
            </div>
        </div>

        <div id="feedback" class="feedback"></div>

        <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">
          Next Game ⭐
        </button>

        <div id="scoreBox" class="score-box"></div>

      </div>
    </div>

    <footer class="footer">
      <p>© 2025 HelpingHands. All rights reserved.</p>
    </footer>

    <script>
      // Curriculum Data
      const questions = [
        {
          type: "matching",
          instruction: "Let's find the matching pairs!",
          pairs: [
            { emoji: "🍎", name: "Apple" },
            { emoji: "🍌", name: "Banana" }
          ] // 2 pairs = 4 cards (Easy Start)
        },
        {
          type: "matching",
          instruction: "Great! Let's try matching a few more.",
          pairs: [
            { emoji: "🐶", name: "Dog" },
            { emoji: "🐱", name: "Cat" },
            { emoji: "🐷", name: "Pig" }
          ] // 3 pairs = 6 cards
        },
        {
          type: "recall",
          instruction: "Look closely... remember where the animals are!",
          items: [
            { emoji: "🚗", name: "Car" },
            { emoji: "🐕", name: "Dog" },
            { emoji: "✈️", name: "Airplane" }
          ],
          targetToFind: "Dog" // Ask them to find a specific one after hiding
        }
      ];

      let currentIdx = 0;
      let score = 0;
      let currentQuestion = null;

      // Memory Game State
      let hasFlippedCard = false;
      let lockBoard = false;
      let firstCard, secondCard;
      let matchesFound = 0;

      // DOM Elements
      const questionTextEl = document.getElementById("questionText");
      const cardGridEl = document.getElementById("cardGrid");
      const feedbackEl = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");
      const scoreBox = document.getElementById("scoreBox");

      // Text to Speech Function (Rate 0.8 for slower pacing)
      function speakText(text) {
        if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-IN";
        utterance.rate = 0.8; 
        window.speechSynthesis.speak(utterance);
      }

      function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
      }

      function loadQuestion() {
        currentQuestion = questions[currentIdx];
        questionTextEl.textContent = currentQuestion.instruction;
        
        // Reset State
        feedbackEl.className = "feedback";
        feedbackEl.textContent = "";
        nextBtn.style.display = "none";
        nextBtn.disabled = true;
        cardGridEl.innerHTML = "";
        matchesFound = 0;
        hasFlippedCard = false;
        lockBoard = false;
        firstCard = null;
        secondCard = null;

        if (currentQuestion.type === "matching") {
          setupMatchingGame();
        } else if (currentQuestion.type === "recall") {
          setupRecallGame();
        }

        setTimeout(() => speakText(currentQuestion.instruction), 600);
      }

      // --- MATCHING GAME LOGIC (Levels 1 & 2) ---
      function setupMatchingGame() {
        // Create 2 of each card
        let deck = [];
        currentQuestion.pairs.forEach(pair => {
          deck.push({ ...pair });
          deck.push({ ...pair });
        });

        deck = shuffleArray(deck);

        deck.forEach((item, index) => {
          const card = createCardHTML(item, index);
          card.onclick = () => flipCard(card, item.name);
          cardGridEl.appendChild(card);
        });
      }

      function flipCard(card, itemName) {
        if (lockBoard) return;
        if (card === firstCard) return;

        card.classList.add("flipped");
        speakText(itemName);

        if (!hasFlippedCard) {
          // First click
          hasFlippedCard = true;
          firstCard = card;
          return;
        }

        // Second click
        hasFlippedCard = false;
        secondCard = card;
        checkForMatch();
      }

      function checkForMatch() {
        const isMatch = firstCard.dataset.name === secondCard.dataset.name;

        if (isMatch) {
          disableCards();
        } else {
          unflipCards();
        }
      }

      function disableCards() {
        // It's a match!
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        
        speakText("Match! " + firstCard.dataset.name);
        
        firstCard.onclick = null;
        secondCard.onclick = null;

        matchesFound += 1;
        
        // Check if level is complete
        if (matchesFound === currentQuestion.pairs.length) {
          setTimeout(() => {
            score++;
            feedbackEl.textContent = "⭐ Amazing memory!";
            feedbackEl.className = "feedback show correct-text";
            speakText("Amazing memory!");
            nextBtn.disabled = false;
            nextBtn.style.display = "block";
          }, 1000);
        }
        
        resetBoard();
      }

      function unflipCards() {
        // Not a match
        lockBoard = true;
        firstCard.classList.add("wrong");
        secondCard.classList.add("wrong");

        setTimeout(() => {
          speakText("Oops! Try again.");
        }, 500);

        // Long delay (2.5s) so the student has time to visually register both cards before they hide
        setTimeout(() => {
          firstCard.classList.remove("flipped", "wrong");
          secondCard.classList.remove("flipped", "wrong");
          resetBoard();
        }, 2500);
      }

      function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
      }

      // --- RECALL GAME LOGIC (Level 3) ---
      function setupRecallGame() {
        const deck = shuffleArray(currentQuestion.items);
        
        // Render cards already flipped (face up)
        deck.forEach((item, index) => {
          const card = createCardHTML(item, index);
          card.classList.add("flipped"); // Show face immediately
          cardGridEl.appendChild(card);
        });

        feedbackEl.textContent = "Memorize the pictures...";
        feedbackEl.className = "feedback show neutral-text";

        // After 4 seconds, flip them face down and change instructions
        setTimeout(() => {
          Array.from(cardGridEl.children).forEach(card => {
            card.classList.remove("flipped");
            
            // Add click events now that they are hidden
            card.onclick = () => handleRecallClick(card);
          });

          const newInstruction = `Where is the ${currentQuestion.targetToFind}?`;
          questionTextEl.textContent = newInstruction;
          feedbackEl.textContent = "";
          feedbackEl.className = "feedback";
          speakText(newInstruction);
          
        }, 4000);
      }

      function handleRecallClick(card) {
        if (lockBoard) return;
        lockBoard = true; // Prevent clicking other cards

        card.classList.add("flipped");
        speakText(card.dataset.name);

        if (card.dataset.name === currentQuestion.targetToFind) {
          // Correct recall!
          card.classList.add("matched");
          setTimeout(() => {
            score++;
            feedbackEl.textContent = "⭐ You found it!";
            feedbackEl.className = "feedback show correct-text";
            speakText("You found it! Great job.");
            nextBtn.disabled = false;
            nextBtn.style.display = "block";
          }, 1000);
        } else {
          // Incorrect recall
          card.classList.add("wrong");
          setTimeout(() => {
            feedbackEl.textContent = "✗ Not quite. Let's see where it is.";
            feedbackEl.className = "feedback show incorrect-text";
            speakText("Not quite. Let's see where it is.");
            
            // Show all cards to reveal the answer
            setTimeout(() => {
              Array.from(cardGridEl.children).forEach(c => {
                c.classList.add("flipped");
                if(c.dataset.name === currentQuestion.targetToFind) {
                  c.classList.add("matched");
                }
              });
              
              nextBtn.disabled = false;
              nextBtn.style.display = "block";
            }, 1500);

          }, 800);
        }
      }

      // --- UTILITY ---
      function createCardHTML(item, index) {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.name = item.name;
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front"></div>
            <div class="card-back">${item.emoji}</div>
          </div>
        `;
        return card;
      }

      function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
          loadQuestion();
        } else {
          // Finish Module
          document.querySelector(".question-bar").style.display = "none";
          cardGridEl.style.display = "none";
          nextBtn.style.display = "none";
          feedbackEl.style.display = "none";

          scoreBox.style.display = "block";
          scoreBox.innerHTML = `You are a memory champion!<br>You finished the module! 🏆🧠`;
          speakText(`You are a memory champion! You finished the module.`);
        }
      }

      // Initialize
      loadQuestion();
    </script>
  </body>
</html>
